<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Administration du guide</title><style>body{background:#21132d;color:white;font:16px system-ui;max-width:850px;margin:25px auto;padding:15px}input,textarea,select,button{font:inherit;padding:9px;border-radius:6px;box-sizing:border-box}input,textarea,select{width:100%;margin:5px 0 12px}button{background:#a40960;color:white;border:0;cursor:pointer;margin:5px}a{color:#70e7ff}label{display:block}header{background:linear-gradient(100deg,#7139a7,#d74687,#258eaa);padding:15px}</style><header><a href="admin.html">← Bureau</a> · <a href="guide-100.html">Voir le guide</a><h1>Administration du guide 100 %</h1></header><label>Jeton administrateur<input id="token" type="password" autocomplete="off"></label><button id="load">Charger les rubriques</button><button id="import" disabled>Importer JSON</button><input type="file" id="jsonfile" accept=".json,application/json" hidden style="display:none"><p id="status" role="status"></p><fieldset id="editor" disabled><select id="list"></select><button id="add">Nouvelle rubrique</button><button id="del">Supprimer</button><div id="fields"></div><button id="save">Valider</button></fieldset><script>const API="https://gta6worker.michelmalandain.workers.dev",$=id=>document.getElementById(id);let items=[],index=-1;const fields={title:'Titre',quantity:'Quantité',summary:'Description',guide:'Lien du guide HTTPS',video:'Lien vidéo HTTPS',image:'Miniature HTTPS'};for(const [k,v] of Object.entries(fields)){const l=document.createElement('label');l.textContent=v;const e=document.createElement(k==='summary'?'textarea':'input');e.id=k;l.append(e);$('fields').append(l)}function status(t){$('status').textContent=t}function draw(i){index=i;$('list').replaceChildren();items.forEach((x,j)=>{$('list').add(new Option(x.title,j))});$('list').selectedIndex=i;for(const k in fields)$(k).value=items[i]?.[k]||''}async function request(method,body){const r=await fetch(API+'/guide',{method,headers:method==='PUT'?{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value.trim()}: {},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d} $('load').onclick=async()=>{try{items=(await request('GET')).items;$('editor').disabled=false;$('import').disabled=false;draw(items.length?0:-1);status('Rubriques chargées')}catch(e){status(e.message)}};$('list').onchange=()=>draw(+$('list').value);$('add').onclick=()=>{items.push({id:crypto.randomUUID(),title:'Nouvelle rubrique'});draw(items.length-1);status('À valider')};$('del').onclick=()=>{if(index>=0&&confirm('Supprimer cette rubrique ?')){items.splice(index,1);draw(items.length?0:-1);status('Suppression à valider')}};$('save').onclick=async()=>{try{if(index>=0){for(const k in fields)items[index][k]=$(k).value.trim();if(!items[index].title)throw Error('Titre requis')}if(!$('token').value.trim())throw Error('Jeton requis');items=(await request('PUT',{items})).items;draw(Math.min(index,items.length-1));status('Enregistré sur le site')}catch(e){status(e.message)}};$('import').onclick=()=>$('jsonfile').click();$('jsonfile').onchange=async()=>{try{const f=$('jsonfile').files[0];if(!f)return;const d=JSON.parse(await f.text());const rows=Array.isArray(d)?d:d.items;if(!Array.isArray(rows)||!rows.length||rows.length>200)throw Error('Liste invalide');const ids=new Set();for(const x of rows){if(!x||typeof x.id!=='string'||!x.id.trim()||typeof x.title!=='string'||!x.title.trim()||ids.has(x.id))throw Error('Rubrique invalide ou doublon');ids.add(x.id);for(const k in fields){if(typeof (x[k]??'')!=='string')throw Error('Champ invalide');if(['guide','video','image'].includes(k)&&x[k]&&!/^https:\/\/[^\s<>"']+$/.test(x[k]))throw Error('Lien HTTPS requis')}}if(!confirm('Remplacer les '+items.length+' rubriques chargées par '+rows.length+' rubriques ? Rien ne sera enregistré avant Valider.'))return;items=rows;draw(0);status('Import prêt : cliquer sur Valider pour enregistrer sur le site.')}catch(e){status(e.message)}finally{$('jsonfile').value=''}};</script></html>
