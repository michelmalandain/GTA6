<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objets — Le Carnet de Leonida</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#16051e;color:#fff;font-family:Georgia,serif}.scroll{overflow-x:auto}.scene{position:relative;max-width:1672px;margin:auto}.scene>img{display:block;width:100%;height:auto}.menu{position:absolute;left:0;top:23.8%;width:100%;height:6.6%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35%;padding:.25% .55%;z-index:10;background:#160920;border-top:2px solid #f95dd7;border-bottom:2px solid #f95dd7;box-shadow:0 0 14px #f43cb977}.menu a{display:flex;align-items:center;justify-content:center;min-width:0;background:linear-gradient(180deg,#341342,#160a25);border:1px solid #f49bdc;border-radius:6px;color:#fff3fb;text-decoration:none;text-align:center;font:italic 700 clamp(9px,1.17vw,18px)/1.1 Georgia,serif;text-shadow:0 1px 3px #000}.menu a:hover,.menu a:focus-visible{box-shadow:0 0 13px #ff5aca;outline:none}.tab{position:absolute;top:35.15%;height:6.7%;border:0;background:transparent;cursor:pointer;z-index:3}.tab:focus-visible{outline:2px solid white;outline-offset:-3px}.tab[aria-selected=true]{box-shadow:inset 0 0 18px #ff33dc66;border-radius:12px}.row{position:absolute;left:31.5%;width:65.5%;height:6.75%;border:0;background:transparent;cursor:pointer;z-index:3}.row:hover{background:#ff60da1b;border-radius:8px}.row:focus-visible{outline:2px solid white}.row-photo{position:absolute;left:32.4%;width:6.2%;height:5.1%;object-fit:cover;border:1px solid #d7a35e;border-radius:5px;pointer-events:none;z-index:4}.label{position:absolute;left:39%;width:48%;height:6.75%;display:flex;align-items:center;pointer-events:none;color:#fff4ed;text-shadow:1px 2px 4px #000;font-size:clamp(11px,2vw,28px);font-style:italic}.label small{display:block;font-size:.55em;font-style:normal;color:#ffcf88;margin-top:3px}.note{text-align:center;padding:12px;font:13px Arial,sans-serif;color:#d4b5d6}.back{position:fixed;inset:0;background:#09020ce8;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.dialog{width:min(800px,100%);max-height:90vh;overflow:auto;background:linear-gradient(150deg,#351043,#10091b);border:2px solid #ef8cda;box-shadow:0 0 32px #f328b96e;border-radius:16px;padding:24px}.dialog h2{color:#ffd28c}.portrait{width:190px;max-width:45%;max-height:240px;object-fit:contain;border:2px solid #d7a35e;border-radius:10px;float:left;margin:0 20px 12px 0}.detail-line{margin:9px 0;line-height:1.55}.detail-line strong{color:#ffd28c}.clear{clear:both}.dialog button{background:#3c1749;border:1px solid #ff84df;color:white;border-radius:8px;padding:10px 20px;cursor:pointer;font:inherit}.close{float:right}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#260a34;border:1px solid #f68be9;border-radius:10px;display:none;z-index:40;text-align:center;font:14px Arial,sans-serif}@media(max-width:700px){.scene{min-width:760px}.menu a{font-size:10px}.label{font-size:16px}}
</style></head><body>
<div class="scroll"><main class="scene"><img src="objets.png" alt="Décor Objets validé : Morticia sur un jet-ski rose devant Vice City"><nav class="menu" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="actualites.html">Actualités</a><a href="missions.html">Missions</a><a href="personnages.html">Personnages</a><a href="admin.html">Administration</a></nav><div id="tabs" role="tablist" aria-label="Catégories d'objets"></div><div id="rows" aria-live="polite"></div></main></div>
<p class="note" id="status">Catégorie Armes : aucune fiche pour le moment. Les données seront ajoutées après vérification.</p>
<div class="back" id="back" role="dialog" aria-modal="true" aria-labelledby="title"><article class="dialog"><button class="close" id="close">Fermer</button><h2 id="title"></h2><div id="details"></div><p><button id="return">Retour à la liste</button></p></article></div><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const categories=[{name:'Armes',left:30.7,width:15.5},{name:'Véhicules',left:46.4,width:16.8},{name:'Vêtements',left:63.4,width:16.7},{name:'Soins & divers',left:80.3,width:17.5}];
// Fiches futures : {name,category,image,description,lieu,caracteristiques,obtention}.
// Aucune donnée de GTA VI n'est inventée pour remplir le tableau.
const entries={0:[],1:[],2:[],3:[]};
let active=0;const tabs=document.getElementById('tabs'),rows=document.getElementById('rows'),back=document.getElementById('back'),status=document.getElementById('status');
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2800)}
categories.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.style.left=c.left+'%';b.style.width=c.width+'%';b.setAttribute('role','tab');b.setAttribute('aria-label',c.name);b.title=c.name;b.addEventListener('click',()=>{active=i;render();if(!entries[i].length)showToast('Aucun objet dans « '+c.name+' » pour le moment.')});tabs.appendChild(b)});
function render(){[...tabs.children].forEach((b,i)=>{b.setAttribute('aria-selected',String(i===active));b.tabIndex=i===active?0:-1});rows.replaceChildren();const list=entries[active];status.textContent='Catégorie '+categories[active].name+' : '+(list.length?list.length+' fiche(s) disponible(s).':'aucune fiche pour le moment. Les données seront ajoutées après vérification.');list.slice(0,6).forEach((entry,i)=>{const y=45.1+i*7.48;const btn=document.createElement('button');btn.className='row';btn.style.top=y+'%';btn.setAttribute('aria-label','Voir la fiche de '+entry.name);btn.onclick=()=>openDetail(entry);rows.appendChild(btn);const label=document.createElement('div');label.className='label';label.style.top=y+'%';const span=document.createElement('span');span.textContent=entry.name;const small=document.createElement('small');small.textContent=entry.lieu||entry.category||'';span.appendChild(small);label.appendChild(span);rows.appendChild(label);if(entry.image){const pic=document.createElement('img');pic.className='row-photo';pic.src=entry.image;pic.alt='Illustration de '+entry.name;pic.style.top=(y+.8)+'%';rows.appendChild(pic)}})}
function openDetail(entry){document.getElementById('title').textContent=entry.name;const d=document.getElementById('details');d.replaceChildren();if(entry.image){const img=document.createElement('img');img.className='portrait';img.src=entry.image;img.alt='Illustration de '+entry.name;d.appendChild(img)}for(const [title,value] of [['Catégorie',categories[active].name],['Description',entry.description],['Caractéristiques',entry.caracteristiques],['Localisation',entry.lieu],['Comment l’obtenir',entry.obtention]]){if(!value)continue;const p=document.createElement('p');p.className='detail-line';const strong=document.createElement('strong');strong.textContent=title+' : ';p.append(strong,document.createTextNode(value));d.appendChild(p)}const clear=document.createElement('div');clear.className='clear';d.appendChild(clear);back.style.display='flex';document.getElementById('close').focus()}
function closeDetail(){back.style.display='none'}document.getElementById('close').onclick=closeDetail;document.getElementById('return').onclick=closeDetail;back.onclick=e=>{if(e.target===back)closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});render();
</script></body></html>
