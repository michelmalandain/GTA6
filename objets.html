</main><script>
/* Le total regroupe les véhicules et les objets (armes, gadgets, vêtements…). */
(async function(){
 const el=document.getElementById('objectTotal');
 const base='https://gta6worker.michelmalandain.workers.dev';
 try{
  const responses=await Promise.all(['/vehicules','/objets'].map(p=>fetch(base+p,{cache:'no-store'})));
  if(responses.some(r=>!r.ok))throw Error('Worker indisponible');
  const [vehicules,objets]=await Promise.all(responses.map(r=>r.json()));
  if(!Array.isArray(vehicules.vehicules)||!Array.isArray(objets.objets))throw Error('Réponse inattendue');
  el.textContent=(vehicules.vehicules.length+objets.objets.length).toLocaleString('fr-FR');
 }catch(e){el.textContent='—';el.title='Compteur indisponible';}
})();
</script></body></html>
