<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Calendrier de Mortitia — Le Carnet de Leonida</title><style>
:root{--gold:#dfbb73;--green:#081e17}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#254535 0%,#07140f 75%);color:#f4e6ca;font-family:Georgia,serif;min-height:100vh}header{text-align:center;padding:38px 15px 18px}h1{font-size:clamp(32px,5vw,65px);font-weight:normal;color:var(--gold);margin:0;text-shadow:0 3px 16px #000}header p{margin:12px;color:#d7c49c}.wrap{max-width:1260px;margin:auto;padding:15px 24px 55px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{border:2px solid #a88446;border-radius:12px;background:#102b20;padding:0;overflow:hidden;cursor:pointer;color:#f7e9cd;box-shadow:0 10px 24px #0009;transition:filter .2s}.card:hover,.card:focus-visible{filter:brightness(1.23);outline:2px solid #ebd69d}.card img{width:100%;height:220px;object-fit:cover;display:block}.card span{display:block;text-align:center;font-size:21px;padding:13px 6px}.bonus{border-color:#e7c680}.actions{display:flex;justify-content:center;gap:16px;margin:28px 0;flex-wrap:wrap}button.action{font:inherit;background:#153a2a;color:#f5dfac;border:1px solid var(--gold);padding:13px 26px;border-radius:22px;cursor:pointer}button.action:hover{filter:brightness(1.3)}.viewer{position:fixed;inset:0;background:#030806f5;display:none;z-index:5;flex-direction:column;align-items:center;justify-content:center;padding:18px}.viewer.open{display:flex}.viewer img{max-width:95vw;max-height:77vh;object-fit:contain;border:2px solid var(--gold);border-radius:6px}.viewer .caption{font-size:24px;margin:12px}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.controls button{font:inherit;background:#153a2a;color:#fff0c8;border:1px solid #ad8b51;border-radius:6px;padding:10px 16px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.card img{height:180px}}@media(max-width:570px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card img{height:145px}.card span{font-size:16px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><header><h1>Le Calendrier de Mortitia</h1><p>Douze mois… et une surprise.</p></header><main class="wrap"><div class="grid" id="grid"></div><div class="actions"><button class="action" id="start">Lancer le diaporama</button><button class="action" id="home">Retour au salon privé</button></div></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photographie du calendrier"><img id="large" alt=""><div class="caption" id="caption"></div><div class="controls"><button id="prev">Précédente</button><button id="play">Lecture automatique</button><button id="next">Suivante</button><button id="close">Fermer</button></div></div><script>
const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre','Mois bonus'];const grid=document.getElementById('grid'),viewer=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption');let current=0,timer=null;const src=i=>'mortitia-'+String(i+1).padStart(2,'0')+'.png';months.forEach((name,i)=>{const b=document.createElement('button');b.className='card'+(i===12?' bonus':'');const im=document.createElement('img');im.src=src(i);im.alt='Mortitia — '+name;im.loading='lazy';const label=document.createElement('span');label.textContent=i===12?'Mois bonus':(i+1)+' — '+name;b.append(im,label);b.addEventListener('click',()=>open(i));grid.appendChild(b)});function show(i){current=(i+13)%13;large.src=src(current);large.alt='Mortitia — '+months[current];caption.textContent=current===12?'Mois bonus':(current+1)+' — '+months[current]}function open(i){show(i);viewer.classList.add('open');document.getElementById('close').focus()}function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='Lecture automatique'}function close(){stop();viewer.classList.remove('open')}function play(){if(timer){stop();return}timer=setInterval(()=>show(current+1),4000);document.getElementById('play').textContent='Pause'}document.getElementById('start').onclick=()=>{open(0);play()};document.getElementById('home').onclick=()=>location.href='salon-prive.html';document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('play').onclick=play;document.getElementById('close').onclick=close;document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script></body></html>
