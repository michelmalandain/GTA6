.navigation{position:absolute;left:0;top:17.8%;width:100%;height:7.2%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45%;padding:.35% .7%;background:#160920;border-top:2px solid #f95dd7;border-bottom:2px solid #f95dd7;box-shadow:0 0 14px #f43cb977;z-index:5}
.navigation a{display:flex;align-items:center;justify-content:center;min-width:0;text-align:center;text-decoration:none;color:#fff3fb;background:linear-gradient(180deg,#371143,#1b092b);border:2px solid #f67ad9;border-radius:9px;font:italic bold clamp(10px,1.2vw,20px)/1.1 Georgia,serif;text-shadow:0 1px 3px #000;box-shadow:0 0 8px #ff54d855}

.animal-counter{position:absolute;left:4%;top:49%;width:19%;min-height:7%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:.4% .8%;border:1px solid #f67ad9;border-radius:9px;background:rgba(22,6,34,.88);box-shadow:0 0 10px #f44cce99;text-align:center;z-index:4}

</style></head><body><main class="stage"><img src="animaux.png" width="1670" height="942" alt="Accueil des animaux de Leonida : Mortitia avec un alligator et quatre catégories d'animaux">

</main><script>
(async function(){
 const total=document.getElementById('animal-total');
 const label=document.getElementById('animal-label');
 try{
  const response=await fetch('https://gta6worker.michelmalandain.workers.dev/animaux',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.animaux))throw new Error('Format inattendu');
  const count=data.animaux.length;
  total.textContent=count;
  label.textContent=count===1?'Animal de Leonida':'Animaux de Leonida';
 }catch(error){total.textContent='—';label.textContent='Compteur indisponible';}
})();
</script></body></html>
