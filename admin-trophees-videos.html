<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Vidéos des trophées</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;color:#f9edff;background:linear-gradient(135deg,#210e35,#3c174f 55%,#082b40);min-height:100vh}header{padding:24px;background:linear-gradient(90deg,#842b89,#b82d88,#197f9d)}h1{margin:0;font-size:clamp(23px,4vw,35px)}main{max-width:780px;margin:auto;padding:24px}section{background:#20162fe8;border:1px solid #8a528f;border-radius:14px;padding:22px;margin:20px 0}label{display:block;margin:16px 0 7px}input,select{width:100%;padding:12px;background:#110d22;border:1px solid #9a689e;border-radius:8px;color:white;font:inherit}button,.link{display:inline-block;margin:12px 8px 0 0;padding:12px 17px;background:#8f287e;color:white;border:1px solid #ef83d5;border-radius:8px;text-decoration:none;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:not-allowed}.danger{background:#653047}#message{min-height:24px;color:#91f1e8}small{color:#c5b3d1}.count{color:#80eaf0}a{color:#8af0ff}</style></head><body><header><h1>Administration — Vidéos des trophées</h1></header><main><a class="link" href="trophees.html">← Voir le guide</a><section><p>Choisis un trophée parmi les 55, colle le lien YouTube, puis enregistre. Aucun nouveau déploiement GitHub ne sera nécessaire.</p><label for="token">Jeton administrateur Cloudflare</label><input id="token" type="password" autocomplete="off" placeholder="Jeton GTA6_ADMIN_TOKEN"><small>Le jeton reste dans cette page uniquement : il n’est ni publié ni enregistré sur le serveur ou dans le navigateur.</small><label for="trophy">Trophée</label><select id="trophy"></select><label for="url">Lien de la vidéo YouTube</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…"><div><button id="save">Enregistrer</button><button id="delete" class="danger">Supprimer la vidéo</button><button id="refresh">Actualiser</button></div><p id="message" role="status"></p><p class="count" id="count"></p></section></main><script>
const API='https://gta6worker.michelmalandain.workers.dev/trophees-videos';
const TROPHIES=[{"id": "un-gout-de-paradis", "name": "Un goût de paradis"}, {"id": "paradis-perdu", "name": "Paradis perdu"}, {"id": "n-s-cul-et-argent-sale", "name": "N*****s, cul et argent sale"}, {"id": "vice-city-baby", "name": "Vice City, baby !"}, {"id": "le-top-du-top-ma", "name": "Le top du top, Ma"}, {"id": "faut-que-tu-saches-quand-descendre", "name": "Faut que tu saches quand descendre"}, {"id": "tu-me-fais-confiance", "name": "Tu me fais confiance ?"}, {"id": "faire-sauter-la-banque", "name": "Faire sauter la banque"}, {"id": "la-vie-de-famille", "name": "La vie de famille"}, {"id": "la-chute-de-dwnply", "name": "La chute de DWNPLY"}, {"id": "detournement", "name": "Détournement"}, {"id": "tempete-de-neige", "name": "Tempête de neige"}, {"id": "la-route-vers-le-retablissement", "name": "La route vers le rétablissement"}, {"id": "cetait-pas-un-accident-de-bateau", "name": "C'était pas un accident de bateau"}, {"id": "cavalier-seul", "name": "Cavalier seul"}, {"id": "inconnus-et-detraques", "name": "Inconnus et détraqués"}, {"id": "loffre-et-la-demande", "name": "L'offre et la demande"}, {"id": "spin-on-this", "name": "Spin On This !"}, {"id": "go-elan", "name": "Go élan"}, {"id": "casse-cou-jusquau-bout", "name": "Casse-cou jusqu'au bout"}, {"id": "touche-a-tout", "name": "Touche-à-tout"}, {"id": "le-flingueur", "name": "Le Flingueur"}, {"id": "top-fun", "name": "Top Fun"}, {"id": "largent-pas-la-reconnaissance", "name": "L'argent, pas la reconnaissance"}, {"id": "joli-coup-de-canne", "name": "Joli coup de canne"}, {"id": "as-du-manche", "name": "As du manche"}, {"id": "une-derniere-chose", "name": "Une dernière chose"}, {"id": "arrete-moi-si-tu-peux", "name": "Arrête-moi si tu peux"}, {"id": "arrete-ton-char", "name": "Arrête ton char"}, {"id": "au-debut", "name": "Au début…"}, {"id": "capital-mal-acquis", "name": "Capital mal acquis"}, {"id": "on-va-au-bowling", "name": "On va au bowling"}, {"id": "record-personnel", "name": "Record personnel"}, {"id": "les-actes-sont-plus-forts", "name": "Les actes sont plus forts"}, {"id": "pas-de-bol-jimagine", "name": "Pas de bol, j'imagine"}, {"id": "la-verite-est-ailleurs", "name": "La vérité est ailleurs"}, {"id": "decatombe", "name": "Décatombe"}, {"id": "pro-de-la-gachette", "name": "Pro de la gâchette"}, {"id": "faut-rester-positifs", "name": "Faut rester positifs"}, {"id": "cartes-sur-table", "name": "Cartes sur table"}, {"id": "coup-de-wainkeur", "name": "Coup de WAiNKeur"}, {"id": "ca-roule", "name": "Ça roule"}, {"id": "letat-du-bonheur", "name": "L'État du Bonheur"}, {"id": "pas-de-petit-profit", "name": "Pas de petit profit"}, {"id": "faites-vous-plaisir", "name": "Faites-vous plaisir"}, {"id": "petits-boxes", "name": "Petits boxes"}, {"id": "de-service", "name": "De service"}, {"id": "des-etoiles-plein-les-yeux", "name": "Des étoiles plein les yeux"}, {"id": "shopping-therapeutique", "name": "Shopping thérapeutique"}, {"id": "vol-furtif", "name": "Vol furtif"}, {"id": "plafond-de-retrait", "name": "Plafond de retrait"}, {"id": "coup-classique-de-lattaque-eclair", "name": "Coup classique de l'attaque éclair"}, {"id": "lutte-contre-les-nuisibles", "name": "Lutte contre les nuisibles"}, {"id": "une-longue-route", "name": "Une longue route"}, {"id": "cest-le-prix-de-vice-city", "name": "C'est le prix de Vice City !"}];
const $=id=>document.getElementById(id);let videos={};
for(const t of TROPHIES){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('trophy').append(o)}
function show(){const id=$('trophy').value;$('url').value=videos[id]||'';$('count').textContent=Object.keys(videos).length+' vidéo(s) enregistrée(s) sur '+TROPHIES.length+' trophées.'}
function message(t){$('message').textContent=t}
async function refresh(){try{const r=await fetch(API,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');videos=d.videos||{};show();message('Liste actualisée.')}catch(e){message('Erreur : '+e.message)}}
async function change(method){const id=$('trophy').value,token=$('token').value.trim(),url=$('url').value.trim();if(!token){message('Saisis ton jeton administrateur.');return}if(method==='PUT'&&!url){message('Colle un lien YouTube.');return}if(method==='DELETE'&&!confirm('Supprimer la vidéo de ce trophée ?'))return;const button=$(method==='PUT'?'save':'delete');button.disabled=true;try{const r=await fetch(API+'/'+encodeURIComponent(id),{method,headers:{Authorization:'Bearer '+token,...(method==='PUT'?{'Content-Type':'application/json'}:{})},...(method==='PUT'?{body:JSON.stringify({url})}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur HTTP '+r.status);videos=d.videos||{};show();message(method==='PUT'?'Vidéo enregistrée !':'Vidéo supprimée.')}catch(e){message('Erreur : '+e.message)}finally{button.disabled=false}}
$('trophy').addEventListener('change',show);$('save').addEventListener('click',()=>change('PUT'));$('delete').addEventListener('click',()=>change('DELETE'));$('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
