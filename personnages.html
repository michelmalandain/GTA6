<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personnages — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}body{margin:0;background:#16051e;color:#fff;font-family:Georgia,serif}.scroll{overflow-x:auto}.scene{position:relative;max-width:1673px;margin:auto}.scene>img{display:block;width:100%;height:auto}.menu{position:absolute;left:0;top:23.8%;width:100%;height:6.6%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35%;padding:.25% .55%;z-index:10;background:#160920;border-top:2px solid #f95dd7;border-bottom:2px solid #f95dd7;box-shadow:0 0 14px #f43cb977}.menu a{display:flex;align-items:center;justify-content:center;min-width:0;background:linear-gradient(180deg,#341342,#160a25);border:1px solid #f49bdc;border-radius:6px;color:#fff3fb;text-decoration:none;text-align:center;font:italic 700 clamp(9px,1.17vw,18px)/1.1 Georgia,serif;text-shadow:0 1px 3px #000}.menu a:hover,.menu a:focus-visible{box-shadow:0 0 13px #ff5aca;outline:none}.tab{position:absolute;top:35.2%;height:6.5%;border:0;background:transparent;cursor:pointer;z-index:2}.tab:focus-visible,.row:focus-visible{outline:2px solid #fff}.tab[aria-selected=true]{box-shadow:inset 0 0 20px #ff33dc77;border-radius:12px}.row{position:absolute;left:31.5%;width:65.3%;height:7%;border:0;background:transparent;cursor:pointer;z-index:2}.row:hover{background:#ff60da1b;border-radius:9px}.label{position:absolute;left:39%;width:48%;height:7%;display:flex;align-items:center;pointer-events:none;color:#fff4ed;text-shadow:1px 2px 4px #000;font-size:clamp(11px,2vw,28px);font-style:italic}.label small{display:block;font-size:.55em;font-style:normal;color:#ffcf88;margin-top:3px}.note{text-align:center;padding:12px;font:13px Arial,sans-serif;color:#d4b5d6}.back{position:fixed;inset:0;background:#09020cdb;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:linear-gradient(150deg,#351043,#10091b);border:2px solid #ef8cda;box-shadow:0 0 32px #f328b96e;border-radius:16px;padding:24px}.dialog h2{color:#ffd28c}.portrait{width:150px;height:180px;object-fit:cover;border:2px solid #d7a35e;border-radius:10px;float:left;margin:0 20px 12px 0}.detail-line{margin:9px 0;line-height:1.55}.detail-line strong{color:#ffd28c}.clear{clear:both}.row-photo{position:absolute;left:32.5%;width:6.2%;height:5.1%;object-fit:cover;border:1px solid #d7a35e;border-radius:5px;pointer-events:none;z-index:3}.dialog p{line-height:1.6}.dialog button{background:#3c1749;border:1px solid #ff84df;color:white;border-radius:8px;padding:10px 20px;cursor:pointer;font:inherit}.close{float:right}.delete-area{clear:both;margin-top:20px;padding-top:14px;border-top:1px solid #76517e}.delete-area input{display:block;width:100%;margin:8px 0;padding:10px;background:#170b22;color:white;border:1px solid #e49bd9;border-radius:6px}.delete-area label{display:block;margin-top:10px}.delete-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.delete-status{font:14px Arial,sans-serif;color:#ffd28c}.delete-area[hidden],.delete-auth[hidden]{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#260a34;border:1px solid #f68be9;border-radius:10px;display:none;z-index:40;text-align:center}@media(max-width:700px){.scene{min-width:760px}.menu a{font-size:10px}.label{font-size:16px}}
</style></head><body><div class="scroll"><main class="scene"><img src="personnages.png" alt="Décor Personnages validé, Morticia en robe noire près d'une voiture rose"><nav class="menu" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="actualites.html">Actualités</a><a href="missions.html">Missions</a><a href="objets.html">Objets</a><a href="admin.html">Administration</a></nav><div id="tabs"></div><div id="rows"></div></main></div><p class="note">Personnages et animaux de Leonida — fiches publiées et personnages principaux présentés.</p><div class="back" id="back" role="dialog" aria-modal="true" aria-labelledby="title"><article class="dialog"><button class="close" id="close">Fermer</button><h2 id="title"></h2><div id="details"></div><div id="deleteArea" class="delete-area" hidden><button type="button" id="deleteTrigger">Supprimer ce personnage</button><div id="deleteAuth" class="delete-auth" hidden><label for="deleteToken">Jeton administrateur Cloudflare</label><input id="deleteToken" type="password" autocomplete="off" spellcheck="false" placeholder="Saisir le jeton administrateur"><div class="delete-actions"><button type="button" id="deleteToggle">Afficher le jeton</button><button type="button" id="deleteConfirm">Confirmer la suppression</button><button type="button" id="deleteCancel">Annuler</button></div><p id="deleteStatus" class="delete-status" role="status" aria-live="polite"></p></div></div><p><button id="return">Retour à la liste</button></p></article></div><div id="toast" class="toast" role="status"></div><script>
const categories=[{name:'Personnages principaux',left:30.7,width:20.1},{name:'PNJ',left:51.1,width:13.6},{name:'Ennemis',left:65,width:13.6},{name:'Animaux',left:79,width:18.1}];const entries={0:[{name:'Lucia Caminos',role:'Personnage principal',image:'lucia.png',description:'Lucia a appris à se battre très jeune grâce à son père. Après avoir défendu sa famille, elle a été incarcérée au pénitencier de Leonida. À sa sortie, elle veut bâtir une vie meilleure, celle dont sa mère rêvait déjà à Liberty City. Déterminée à prendre son avenir en main, elle forme un duo central avec Jason.',lieux:'Pénitencier de Leonida ; Liberty City (passé) ; État de Leonida',relations:'Jason Duval (partenaire) ; son père et sa mère (noms non précisés)',missions:'Aucune liste de missions associées vérifiée pour cette fiche.'},{name:'Jason Duval',role:'Personnage principal',image:'jason.png',description:'Jason a grandi au contact d’escrocs et de délinquants. Après un passage dans l’armée, où il espérait laisser derrière lui une adolescence difficile, il s’est installé dans les Keys et a travaillé pour des trafiquants de drogue locaux. Sa rencontre avec Lucia pourrait changer radicalement son existence.',lieux:'Leonida Keys ; État de Leonida',relations:'Lucia Caminos (partenaire) ; Cal Hampton (ami)',missions:'Aucune liste de missions associées vérifiée pour cette fiche.'}],1:[],2:[],3:[]};let active=0;const tabs=document.getElementById('tabs'),rows=document.getElementById('rows'),back=document.getElementById('back');function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.timer);window.timer=setTimeout(()=>el.style.display='none',3000)}categories.forEach((c,i)=>{let b=document.createElement('button');b.className='tab';b.style.left=c.left+'%';b.style.width=c.width+'%';b.setAttribute('aria-label',c.name);b.title=c.name;b.addEventListener('click',()=>{active=i;render();if(!entries[i].length)showToast('Aucune fiche dans « '+c.name+' » pour le moment.')});tabs.appendChild(b)});function render(){[...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected',String(i===active)));rows.replaceChildren();entries[active].slice(0,6).forEach((entry,i)=>{let y=45.2+i*7.65;let btn=document.createElement('button');btn.className='row';btn.style.top=y+'%';btn.setAttribute('aria-label','Voir la fiche de '+entry.name);btn.onclick=()=>open(entry);rows.appendChild(btn);let label=document.createElement('div');label.className='label';label.style.top=y+'%';let span=document.createElement('span');span.textContent=entry.name;let small=document.createElement('small');small.textContent=entry.role;span.appendChild(small);label.appendChild(span);rows.appendChild(label);if(entry.image){let pic=document.createElement('img');pic.className='row-photo';pic.src=entry.image;pic.alt='Portrait de '+entry.name;pic.style.top=(y+.9)+'%';rows.appendChild(pic)}})}let currentPerson=null;function open(entry){currentPerson=entry;resetDelete();document.getElementById("deleteArea").hidden=!entry.id;document.getElementById('title').textContent=entry.name;let d=document.getElementById('details');d.replaceChildren();if(entry.image){let img=document.createElement('img');img.className='portrait';img.src=entry.image;img.alt='Portrait illustré de '+entry.name+' (extrait du décor validé)';d.appendChild(img)}for(const [titre,contenu] of [['Rôle',entry.role],['Biographie',entry.description],['Lieux connus',entry.lieux],['Relations',entry.relations],['Missions associées',entry.missions]]){let p=document.createElement('p');p.className='detail-line';let strong=document.createElement('strong');strong.textContent=titre+' : ';p.appendChild(strong);p.appendChild(document.createTextNode(contenu||'Non renseigné'));d.appendChild(p)}let clear=document.createElement('div');clear.className='clear';d.appendChild(clear);let note=document.createElement('p');note.style.fontSize='12px';note.style.color='#cbb7d2';note.textContent=entry.published?'Fiche publiée depuis l’administration du Carnet de Leonida.':'Biographie : informations officielles Rockstar Games. Portrait : illustration du site.';d.appendChild(note);back.style.display='flex';document.getElementById('close').focus()}function close(){back.style.display='none';currentPerson=null;resetDelete()}document.getElementById('close').onclick=close;document.getElementById('return').onclick=close;back.onclick=e=>{if(e.target===back)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
async function loadPeople(){try{const res=await fetch('https://gta6worker.michelmalandain.workers.dev/personnages',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.personnages))throw Error('Format inattendu');for(const item of data.personnages){const i=categories.findIndex(c=>c.name===item.kind);if(i<0)continue;const entry={name:item.name,role:item.kind,image:item.image||'',description:item.summary||'',lieux:item.place||'',relations:'',missions:'',published:true,id:item.id};const old=entries[i].findIndex(e=>e.name.toLocaleLowerCase('fr')===entry.name.toLocaleLowerCase('fr'));if(old>=0)entries[i][old]=entry;else entries[i].push(entry)}render();document.querySelector('.note').textContent=data.personnages.length+' fiche(s) publiées depuis Cloudflare. Les fiches Lucia et Jason sont conservées.'}catch(e){document.querySelector('.note').textContent='Fiches de référence visibles. Chargement Cloudflare indisponible : '+e.message}}
const deleteArea=document.getElementById('deleteArea'),deleteAuth=document.getElementById('deleteAuth'),deleteToken=document.getElementById('deleteToken'),deleteTrigger=document.getElementById('deleteTrigger'),deleteConfirm=document.getElementById('deleteConfirm'),deleteStatus=document.getElementById('deleteStatus'),deleteToggle=document.getElementById('deleteToggle');
function resetDelete(){deleteAuth.hidden=true;deleteToken.value='';deleteToken.type='password';deleteToggle.textContent='Afficher le jeton';deleteStatus.textContent='';deleteConfirm.disabled=false;deleteTrigger.disabled=false}
deleteTrigger.onclick=()=>{deleteAuth.hidden=false;deleteToken.focus()};
document.getElementById('deleteCancel').onclick=()=>{resetDelete();deleteTrigger.focus()};
deleteToggle.onclick=()=>{deleteToken.type=deleteToken.type==='password'?'text':'password';deleteToggle.textContent=deleteToken.type==='password'?'Afficher le jeton':'Masquer le jeton'};
deleteConfirm.onclick=async()=>{if(!currentPerson||!currentPerson.id)return;const person=currentPerson;const token=deleteToken.value.trim();if(!token){deleteStatus.textContent='Saisis ton jeton administrateur.';deleteToken.focus();return}if(!confirm('Supprimer définitivement « '+person.name+' » de Cloudflare ?'))return;deleteConfirm.disabled=true;deleteStatus.textContent='Suppression en cours sur Cloudflare…';try{const res=await fetch('https://gta6worker.michelmalandain.workers.dev/personnages/'+encodeURIComponent(person.id),{method:'DELETE',headers:{Authorization:'Bearer '+token},cache:'no-store'});let data={};try{data=await res.json()}catch{}if(!res.ok||data.ok!==true)throw Error(res.status===401?'Jeton administrateur refusé (401).':data.error||'Suppression refusée (HTTP '+res.status+').');for(const list of Object.values(entries)){const i=list.findIndex(x=>x.id===person.id);if(i>=0)list.splice(i,1)}close();render();showToast('Personnage supprimé de Cloudflare.')}catch(err){deleteStatus.textContent=err.message;deleteConfirm.disabled=false}};
loadPeople();render();
</script></body></html>
