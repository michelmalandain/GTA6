<script>
const GTA6_API='https://gta6worker.michelmalandain.workers.dev';
const zoneArticles=document.getElementById('articles-dynamiques');
const etat=document.getElementById('etat-actualites');
function dateFR(value){const [y,m,d]=value.split('-').map(Number);return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(y,m-1,d));}
async function afficherActualites(){
 try{
  const r=await fetch(GTA6_API+'/actualites',{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json();if(!Array.isArray(data.articles))throw new Error('Réponse inattendue');
  zoneArticles.replaceChildren();
  data.articles.forEach((a,i)=>{
   const article=document.createElement('article');article.id='actualite-'+(i+1);
   const time=document.createElement('time');time.dateTime=a.date;time.textContent=dateFR(a.date);
   const h=document.createElement('h3');h.textContent=a.title;
   const desc=document.createElement('p');desc.textContent=a.summary;
   article.append(time,h,desc);
   if(a.image&&/^[a-zA-Z0-9_./-]+$/.test(a.image)&&!a.image.startsWith('/')&&!a.image.includes('..')){
    const img=document.createElement('img');img.src=a.image;img.alt='Illustration : '+a.title;img.loading='lazy';img.style.cssText='display:block;max-width:100%;max-height:380px;object-fit:contain;margin-top:14px;border-radius:8px';article.append(img);
   }
   zoneArticles.append(article);
  });
  etat.textContent=data.articles.length?'': 'Aucune actualité publiée pour le moment.';
  document.querySelectorAll('.news1,.news2,.news3').forEach((link,i)=>{
   if(data.articles[i]){link.href='#actualite-'+(i+1);link.setAttribute('aria-label','Lire : '+data.articles[i].title)}
   else{link.removeAttribute('href');link.setAttribute('aria-label','Actualité illustrée dans le décor (texte non actualisable)');link.style.cursor='default'}
  });
 }catch(e){etat.textContent='Impossible de charger les actualités pour le moment.';console.error('GTA6 actualités',e)}
}
afficherActualites();
</script><footer>GTA VI — Le Carnet de Leonida · Site de fans non officiel</footer></body></html>
