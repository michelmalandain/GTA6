<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Tips & Tricks</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#14081d,#351043);color:white;font:16px Arial,sans-serif;min-height:100vh}main{max-width:1000px;margin:auto;padding:28px 18px}h1{color:#ff9edc}h2{color:#8cecff}a{color:#9deaff}.box{background:#1c102c;border:1px solid #ac5ba5;border-radius:12px;padding:20px;margin:18px 0}label{display:block;margin:12px 0 6px}input{width:100%;padding:12px;border-radius:7px;border:1px solid #af75ac;background:#110b1b;color:white;font:inherit}button{padding:10px 16px;border:1px solid #ffa4e5;background:#8b286f;color:white;border-radius:8px;cursor:pointer;font:inherit;margin:5px 7px 5px 0}button:hover{background:#b63694}.danger{background:#79243e}.row{display:flex;gap:15px;align-items:center;justify-content:space-between;border-bottom:1px solid #55345c;padding:14px 0}.row strong{display:block}.row small{color:#d3b5d0;overflow-wrap:anywhere}.row>div:first-child{min-width:0}#status{min-height:25px;color:#a7f6ec}.sub{color:#d9c2dc}#videos:empty:after{content:'Aucune vidéo enregistrée.';color:#d9c2dc}
</style></head><body><main><p><a href="tips.html">Retour à Tips & Tricks</a></p><h1>Administration — Tips & Tricks</h1><p class="sub">Ajout, modification et suppression de vidéos YouTube. Enregistrement dans le Worker Cloudflare.</p><section class="box"><label for="token">Jeton administrateur Cloudflare</label><input id="token" type="password" autocomplete="off" placeholder="GTA6_ADMIN_TOKEN"><p class="sub">Le jeton reste uniquement dans cette page et n'est jamais enregistré dans le navigateur.</p><button id="refresh">Charger les vidéos</button><p id="status" role="status"></p></section><section class="box"><h2 id="formTitle">Ajouter une vidéo</h2><form id="form"><label for="title">Titre</label><input id="title" required maxlength="160"><label for="url">Lien YouTube</label><input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..."><p><button type="submit" id="save">Enregistrer</button><button type="button" id="cancel" hidden>Annuler la modification</button></p></form></section><section class="box"><h2>Vidéos enregistrées</h2><div id="videos"></div></section></main><script>
'use strict';
const API='https://gta6worker.michelmalandain.workers.dev';let items=[],editId=null;
const $=id=>document.getElementById(id);const status=message=>{$('status').textContent=message};
function token(){return $('token').value.trim()}
async function api(path,method='GET',body){const headers={};if(method!=='GET'){if(!token())throw Error('Saisis ton jeton administrateur.');headers.Authorization='Bearer '+token();headers['Content-Type']='application/json'}const res=await fetch(API+path,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Erreur HTTP '+res.status);return data}
function clearForm(){editId=null;$('form').reset();$('formTitle').textContent='Ajouter une vidéo';$('cancel').hidden=true}
function draw(){const root=$('videos');root.replaceChildren();items.forEach(v=>{const row=document.createElement('div');row.className='row';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=v.title;const url=document.createElement('small');url.textContent=v.url;info.append(name,url);const buttons=document.createElement('div');const edit=document.createElement('button');edit.textContent='Modifier';edit.onclick=()=>{editId=v.id;$('title').value=v.title;$('url').value=v.url;$('formTitle').textContent='Modifier la vidéo';$('cancel').hidden=false;$('title').focus()};const del=document.createElement('button');del.className='danger';del.textContent='Supprimer';del.onclick=async()=>{if(!confirm('Supprimer cette vidéo ?'))return;try{await api('/tips/'+encodeURIComponent(v.id),'DELETE');status('Vidéo supprimée.');await load()}catch(e){status(e.message)}};buttons.append(edit,del);row.append(info,buttons);root.append(row)})}
async function load(){try{const data=await api('/tips');items=Array.isArray(data.tips)?data.tips:[];draw();status(items.length+' vidéo(s) enregistrée(s).')}catch(e){status(e.message)}}
$('refresh').onclick=load;$('cancel').onclick=clearForm;
$('form').onsubmit=async e=>{e.preventDefault();try{const data={title:$('title').value.trim(),url:$('url').value.trim()};await api(editId?'/tips/'+encodeURIComponent(editId):'/tips',editId?'PUT':'POST',data);clearForm();await load();status('Base mise à jour.')}catch(e){status(e.message)}};
load();
</script></body></html>
