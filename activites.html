<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activités — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#12041c;color:white;font-family:Georgia,serif}.stage{position:relative;width:min(100%,1536px);margin:auto}.stage>img{display:block;width:100%;height:auto}.nav{position:absolute;left:1%;top:17.7%;width:98%;height:6.6%;display:grid;grid-template-columns:repeat(8,1fr);gap:.35%;z-index:2}.nav a{display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-weight:bold;font-style:italic;font-size:clamp(8px,1.45vw,21px);border:1px solid #fc65e9;border-radius:12px;background:linear-gradient(#390e4b,#07030c);box-shadow:0 0 8px #f333c9;text-shadow:0 1px 3px #000}.nav a:hover{background:#65216c}.open{position:absolute;top:83%;left:43%;width:23%;height:7%;z-index:2;color:#fff;font:italic bold clamp(11px,1.4vw,22px) Georgia,serif;border:2px solid #ff78ed;border-radius:18px;background:linear-gradient(#5d1469,#16041e);box-shadow:0 0 16px #f333c9;cursor:pointer}.counter{position:absolute;top:26%;right:3%;background:#16051ddc;border:1px solid #ff78ed;border-radius:12px;padding:.65%;font-size:clamp(9px,1.1vw,16px)}.overlay{position:fixed;inset:0;background:#050009e8;z-index:10;display:flex;justify-content:center;align-items:center;padding:15px}.overlay[hidden]{display:none}.panel{width:min(940px,98vw);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#300d3c,#10051a);border:2px solid #f46add;border-radius:16px;padding:20px;box-shadow:0 0 28px #d82bbd}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h2{margin:0 0 15px}.filters{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}.filters input,.filters select{background:#210b31;color:#fff;border:1px solid #e880dc;border-radius:8px;padding:10px;font:inherit;flex:1 1 190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{background:#200c2c;border:1px solid #7d397d;border-radius:10px;padding:9px;color:white;text-align:left;cursor:pointer;font:inherit}.card:hover{border-color:#ff95e9;background:#37133e}.card img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#100a17;border-radius:7px}.card strong,.card small{display:block;margin-top:7px}.card small{color:#efb8ee}.btn{background:#35123e;border:1px solid #dd81cf;border-radius:8px;color:white;padding:8px 13px;font:inherit;cursor:pointer}.detail{display:grid;grid-template-columns:minmax(0,43%) 1fr;gap:20px}.detail img{width:100%;max-height:350px;object-fit:contain;background:#100a17;border-radius:8px}.detail p{line-height:1.5;white-space:pre-line}.video{width:100%;max-height:320px;margin-top:14px}.notice{color:#e7bedf;font-size:13px}@media(max-width:650px){.nav a{font-size:clamp(6px,1.2vw,10px);border-radius:5px}.detail{grid-template-columns:1fr}.panel{padding:12px}}
</style></head><body><main class="stage"><img src="activites.png" width="1536" height="1024" alt="Décor des activités de Leonida avec Mortitia et tableau illustré"><nav class="nav" aria-label="Navigation"><a href="index.html">Accueil</a><a href="quiz.html">Quiz</a><a href="actualites.html">Actualités</a><a href="missions.html">Missions</a><a href="personnages.html">Personnages</a><a href="animaux.html">Animaux</a><a href="objets.html">Objets</a><a href="admin.html">Administration</a></nav><div class="counter" id="total">Activités</div><button class="open" id="open">VOIR LES ACTIVITÉS</button></main><div class="overlay" id="catalogue" hidden><section class="panel" role="dialog" aria-modal="true" aria-label="Catalogue des activités"><div class="head"><h2>Activités de Leonida</h2><button class="btn" id="close">Fermer</button></div><div class="filters"><input id="search" placeholder="Rechercher une activité" aria-label="Rechercher une activité"><select id="category" aria-label="Catégorie"><option value="">Toutes les catégories</option></select></div><div class="grid" id="cards"></div><p class="notice" id="notice"></p></section></div><div class="overlay" id="details" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="head"><h2 id="detail-title"></h2><button class="btn" id="close-detail">Fermer</button></div><div class="detail" id="detail-body"></div><div id="detail-video"></div></section></div><script>
'use strict';const $=id=>document.getElementById(id);let items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const category=x=>(x.summary||'').match(/^Catégorie\s*:\s*([^\n]+)/i)?.[1]||'Autres';function hide(id){$(id).hidden=true}function show(id){$(id).hidden=false} $('open').onclick=()=>show('catalogue');$('close').onclick=()=>hide('catalogue');$('close-detail').onclick=()=>hide('details');for(const id of ['catalogue','details'])$(id).addEventListener('click',e=>{if(e.target===$(id))hide(id)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('details').hidden)hide('details');else hide('catalogue')}});
function render(){const term=$('search').value.toLocaleLowerCase('fr'),c=$('category').value;const filtered=items.filter(x=>(!c||category(x)===c)&&(!term||(x.name+' '+x.summary).toLocaleLowerCase('fr').includes(term)));$('cards').replaceChildren();for(const x of filtered){const b=document.createElement('button');b.className='card';b.innerHTML='<img loading="lazy" src="'+esc(x.image||'')+'" alt=""><strong>'+esc(x.name)+'</strong><small>'+esc(category(x))+'</small>';b.onclick=()=>detail(x);$('cards').append(b)}$('notice').textContent=filtered.length?filtered.length+' activité(s) affichée(s)':'Aucune activité trouvée.'}
function detail(x){$('detail-title').textContent=x.name;let summary=(x.summary||'').replace(/^Catégorie\s*:[^\n]*(\n|$)/i,'').trim();$('detail-body').innerHTML='<img src="'+esc(x.image||'')+'" alt="'+esc(x.name)+'"><div><p><strong>Catégorie :</strong> '+esc(category(x))+'</p>'+(x.place?'<p><strong>Lieu :</strong> '+esc(x.place)+'</p>':'')+'<p>'+esc(summary||'Informations à compléter.')+'</p></div>';$('detail-video').replaceChildren();if(x.video&&/^(https:\/\/|images\/)/i.test(x.video)&&/\.(mp4|webm)(\?.*)?$/i.test(x.video)){const v=document.createElement('video');v.className='video';v.controls=true;v.preload='none';v.src=x.video;$('detail-video').append(v)}show('details')}
$('search').oninput=render;$('category').onchange=render;fetch('https://gta6worker.michelmalandain.workers.dev/activites',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('API indisponible (HTTP '+r.status+')');return r.json()}).then(data=>{items=Array.isArray(data.activites)?data.activites:[];$('total').textContent=items.length+' activités';for(const c of [...new Set(items.map(category))].sort((a,b)=>a.localeCompare(b,'fr')))$('category').add(new Option(c,c));render()}).catch(e=>{$('total').textContent='Activités';$('notice').textContent='Catalogue indisponible : '+e.message+'. Vérifier la route /activites du Worker Cloudflare.'});
</script></body></html>
