<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Missions — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:#15051e url("admin-missions-fond.png") left top / cover fixed no-repeat}
/* Un panneau opaque couvre totalement le formulaire fictif imprimé dans l'image. */
header,main{position:relative;z-index:1;width:68%;margin-left:auto;margin-right:0;background:#100b18}
header{padding:24px 34px 8px;border-left:2px solid #f6b34c;text-align:center}
header h1{margin:0;color:#ffe0ad;font:italic bold clamp(26px,2.8vw,43px) Georgia,serif;text-shadow:0 0 12px #ff32c4}
.nav{display:none}main{min-height:calc(100vh - 86px);padding:14px 34px 32px;border-left:2px solid #f6b34c}
.card{background:#151021;border:2px solid #e6a84b;border-radius:18px;padding:26px 34px;margin:0 0 22px;box-shadow:0 0 16px #f05aa455}
h2{font:italic bold 29px Georgia,serif;color:#ffd78e;margin:0 0 12px}.muted{font-size:14px;color:#e5d5e5;line-height:1.5}
label{display:block;color:#ffd78e;font-size:16px;font-weight:bold;margin:16px 0 7px}
input,textarea,select{display:block;width:100%;padding:13px 14px;background:#071c1c;color:#fff;border:1px solid #dca94c;border-radius:6px;font:17px Arial,sans-serif}
textarea{min-height:140px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #fa6ac8;outline-offset:1px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button,.back{display:inline-block;padding:12px 22px;color:#fff;background:linear-gradient(#c21a85,#770e5c);border:1px solid #ffd178;border-radius:8px;cursor:pointer;text-decoration:none;font-size:16px;box-shadow:0 0 10px #d62c8a55}button:hover,.back:hover{box-shadow:0 0 16px #ff69d1}
.entry{border-top:1px solid #76517e;padding:16px 0}.entry strong,.status{color:#ffe1ac}.entry p{color:#dcc9df;white-space:pre-wrap}.status{min-height:20px}.danger{border-color:#ff9494}.preview{max-width:240px;max-height:160px;object-fit:contain;margin-top:10px;border-radius:6px}.footer{display:flex;justify-content:flex-end;margin:14px 0 24px}
@media(max-width:1100px){header,main{width:70%}main{padding:14px 18px 24px}.card{padding:20px}}
@media(max-width:750px){body{background-position:22% top;background-size:auto 100vh}header,main{width:100%;border-left:0;background:rgba(16,11,24,.96)}header{padding:18px 10px 8px}main{padding:12px}.card{padding:17px}input,textarea,select{font-size:16px}}
</style></head><body><header><h1>Administration — Missions</h1></header><main><section class="card"><h2>Ajouter ou modifier une fiche</h2><p class="muted">Les modifications sont enregistrées directement dans Cloudflare. Les numéros GTA Base et les identifiants existants sont conservés.</p><div class="auth"><label for="token">Jeton administrateur Cloudflare</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Jeton administrateur"><div class="actions"><button type="button" id="connect">Charger les missions</button><button type="button" id="importJson">Importer un fichier JSON</button><input type="file" id="jsonFile" accept=".json,application/json" hidden style="display:none"></div></div><form id="editor"><input type="hidden" id="entryId"><label for="name">Titre / Nom</label><input id="name" maxlength="160" required><label for="kind">Catégorie</label><select id="kind"><option>Missions principales</option><option>Missions secondaires</option></select><label for="summary">Description / Biographie</label><textarea id="summary"></textarea><label for="place">Lieu / Localisation</label><input id="place"><label for="image">Image (nom de fichier ou URL autorisée)</label><input id="image" placeholder="exemple.png"><img id="preview" class="preview" alt="Aperçu de l’image" hidden><label for="source">Guide GTA Base (lien vers la fiche)</label><input id="source" type="url" placeholder="https://www.gtabase.com/fr/missions/gta-6/..."><label for="video">Vidéo YouTube — SPOILER SOLUTION</label><input id="video" type="url" placeholder="https://…"><div class="actions"><button type="submit">Valider</button><button type="button" id="new">Nouvelle fiche</button></div></form><p id="status" class="status" aria-live="polite"></p></section><section class="card"><h2>Fiches enregistrées</h2><p class="muted" id="count">Connecte-toi pour afficher les missions Cloudflare.</p><input id="filter" type="search" placeholder="Rechercher une mission…" aria-label="Rechercher une mission"><div id="list"></div></section><div class="footer"><a class="back" href="admin.html">Retour à l’administration</a></div></main><script>
'use strict';
const API='https://gta6worker.michelmalandain.workers.dev/missions';
const $=id=>document.getElementById(id), fields=['name','kind','summary','place','image','source','video'];
let missions=[],connected=false;
function status(message,error=false){$('status').textContent=message;$('status').style.color=error?'#ff9fba':'#ffe1ac'}
function auth(){const t=$('token').value.trim();if(!t)throw Error('Saisis ton jeton Cloudflare.');return {'Authorization':'Bearer '+t}}
async function request(path='',options={}){const r=await fetch(API+path,{...options,headers:{...auth(),...(options.headers||{})},cache:'no-store'});let data;try{data=await r.json()}catch{throw Error('Réponse du serveur illisible.')}if(!r.ok)throw Error(data.error||'Erreur HTTP '+r.status);return data}
function reset(){ $('editor').reset();$('entryId').value='';$('preview').hidden=true;status('Nouvelle fiche prête.');}
function preview(){let src=$('image').value.trim();if(src&&!/^https:\/\//i.test(src)&&/^[a-z0-9_./-]+\.(png|jpe?g|webp)$/i.test(src))src=src;const img=$('preview');img.hidden=!src;if(src)img.src=src;else img.removeAttribute('src')}
$('image').addEventListener('input',preview);$('new').onclick=reset;
async function refresh(){const data=await request('?admin=1');if(!Array.isArray(data.missions))throw Error('Liste Cloudflare invalide.');missions=data.missions;connected=true;render();status('Connecté à Cloudflare : '+missions.length+' mission(s).')}
$('connect').onclick=async()=>{try{status('Chargement…');await refresh()}catch(e){connected=false;status(e.message,true)}};
$('filter').oninput=render;
function render(){const list=$('list');list.replaceChildren();$('count').textContent=connected?missions.length+' mission(s) dans Cloudflare.':'Non connecté.';const q=$('filter').value.trim().toLocaleLowerCase('fr');const rows=missions.filter(x=>String(x.name||'').toLocaleLowerCase('fr').includes(q));if(!rows.length){list.textContent=connected?'Aucune mission correspondante.':'Charge les missions pour les modifier.';return}
rows.forEach(item=>{const row=document.createElement('div');row.className='entry';const title=document.createElement('strong');title.textContent=(Number.isInteger(item.number)?'N° '+item.number+' — ':'')+item.name+' — '+item.kind;row.append(title);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.type='button';edit.textContent='Modifier';edit.onclick=()=>{$('entryId').value=item.id;fields.forEach(f=>$(f).value=item[f]||'');preview();status('Modification : '+item.name);window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Supprimer';del.onclick=async()=>{if(!confirm('Supprimer définitivement « '+item.name+' » dans Cloudflare ?'))return;try{await request('/'+encodeURIComponent(item.id),{method:'DELETE'});reset();await refresh()}catch(e){status(e.message,true)}};actions.append(edit,del);row.append(actions);list.append(row)})}
$('editor').onsubmit=async e=>{e.preventDefault();if(!connected){status('Connecte-toi à Cloudflare avant de valider.',true);return}const id=$('entryId').value;const body={};fields.forEach(f=>body[f]=$(f).value.trim());try{status('Enregistrement dans Cloudflare…');const result=await request(id?'/'+encodeURIComponent(id):'',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('entryId').value=result.mission?.id||id;await refresh();status('Mission enregistrée dans Cloudflare : '+body.name+'.')}catch(err){status('Échec de l’enregistrement : '+err.message,true)}};
$('importJson').onclick=()=>{try{auth();$('jsonFile').click()}catch(e){status(e.message,true)}};
$('jsonFile').onchange=async()=>{const file=$('jsonFile').files[0];$('jsonFile').value='';if(!file)return;try{const data=JSON.parse(await file.text());const rows=Array.isArray(data)?data:data.missions;if(!Array.isArray(rows)||!rows.length)throw Error('Catalogue JSON invalide.');if(!confirm('Remplacer le catalogue actuel par '+rows.length+' missions ?'))return;status('Importation en cours…');const result=await request('/catalogue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({missions:rows})});await refresh();status('Import terminé : '+result.total+' missions.')}catch(e){status('Échec de l’import : '+e.message,true)}};
render();
</script></body></html>
