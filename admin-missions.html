<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Missions — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:#15051e url("admin-missions-fond.png") center center / cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,transparent 0%,transparent 32%,rgba(12,4,22,.38) 40%,rgba(12,4,22,.75) 100%);pointer-events:none}header{position:relative;text-align:center;padding:18px 0 6px}header h1{margin:0;color:#ffe0ad;font:italic bold clamp(24px,3vw,40px) Georgia,serif;text-shadow:0 2px 10px #18041f,0 0 16px #ff32c4}.nav{display:none}main{position:relative;width:min(860px,56vw);margin:12px 5vw 30px auto}.card{background:rgba(14,7,23,.97);border:2px solid #e6a84b;border-radius:19px;padding:22px 28px;margin-bottom:20px;box-shadow:0 0 20px #f05aa477,0 10px 35px #100416}h2{font:italic bold 26px Georgia,serif;color:#ffd78e;margin:0 0 10px}.muted{font-size:13px;color:#e5d5e5;line-height:1.45}label{display:block;color:#ffd78e;font-weight:bold;margin:12px 0 5px}input,textarea,select{display:block;width:100%;padding:10px 12px;background:#071c1c;color:#fff;border:1px solid #dca94c;border-radius:6px;font:15px Arial,sans-serif}textarea{min-height:88px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #fa6ac8;outline-offset:1px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,.back{display:inline-block;padding:10px 18px;color:#fff;background:linear-gradient(#c21a85,#770e5c);border:1px solid #ffd178;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px;box-shadow:0 0 10px #d62c8a55}button:hover,.back:hover{box-shadow:0 0 16px #ff69d1}.entry{border-top:1px solid #76517e;padding:14px 0}.entry strong,.status{color:#ffe1ac}.entry p{color:#dcc9df;white-space:pre-wrap}.status{min-height:20px}.danger{border-color:#ff9494}.preview{max-width:240px;max-height:160px;object-fit:contain;margin-top:10px;border-radius:6px}.footer{display:flex;justify-content:flex-end;margin:14px 0 24px}@media(max-width:1000px){main{width:min(700px,68vw);margin-right:3vw}.card{padding:18px}}@media(max-width:700px){body{background-position:25% top;background-size:auto 100vh}body:before{background:rgba(12,4,22,.60)}main{width:94%;margin:12px auto}.card{background:rgba(14,7,23,.96);padding:16px}header{padding:18px 8px 8px}}
</style></head><body><header><h1>Administration — Missions</h1></header><main><section class="card"><h2>Ajouter ou modifier une fiche</h2><p class="muted">Les fiches créées ici sont des brouillons enregistrés dans ce navigateur. Elles ne sont pas encore publiées sur le site.</p><form id="editor"><input type="hidden" id="entryId"><label for="name">Titre / Nom</label><input id="name" maxlength="160" required><label for="kind">Catégorie</label><select id="kind"><option>Missions principales</option><option>Missions secondaires</option></select><label for="summary">Description / Biographie</label><textarea id="summary"></textarea><label for="place">Lieu / Localisation</label><input id="place"><label for="image">Image (nom de fichier ou URL autorisée)</label><input id="image" placeholder="exemple.png"><img id="preview" class="preview" alt="Aperçu de l’image" hidden><label for="video">Vidéo — SPOILER SOLUTION (adresse)</label><input id="video" type="url" placeholder="https://…"><div class="actions"><button type="submit">Valider</button><button type="button" id="new">Nouvelle fiche</button></div></form><p id="status" class="status" aria-live="polite"></p></section><section class="card"><h2>Fiches enregistrées</h2><div id="list"></div></section><div class="footer"><a class="back" href="admin.html">Retour à l’administration</a></div></main><script>
'use strict';const section='missions',key='leonida-admin-brouillons-v1',fields=['name','kind','summary','place','image','video'];const $=id=>document.getElementById(id);function load(){try{return JSON.parse(localStorage.getItem(key))||'{}')}catch{return {}}}function save(d){localStorage.setItem(key,JSON.stringify(d))}function reset(){$('editor').reset();$('entryId').value='';$('status').textContent='';$('preview').hidden=true}function preview(){const v=$('image').value.trim();if(v && (/^https:\/\//.test(v)||/^[\w./-]+\.(png|jpg|jpeg|webp)$/i.test(v))){$('preview').src=v;$('preview').hidden=false}else $('preview').hidden=true}$('image').addEventListener('change',preview);$('new').onclick=reset;function render(){const items=load()[section]||[];$('list').replaceChildren();if(!items.length){$('list').textContent='Aucune fiche enregistrée.';return}items.forEach(item=>{const row=document.createElement('div');row.className='entry';const strong=document.createElement('strong');strong.textContent=item.name+' — '+item.kind;row.append(strong);if(item.summary){const para=document.createElement('p');para.textContent=item.summary;row.append(para)}const buttons=document.createElement('div');buttons.className='actions';const edit=document.createElement('button');edit.textContent='Modifier';edit.onclick=()=>{$('entryId').value=item.id;fields.forEach(f=>$(f).value=item[f]||'');preview();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.textContent='Supprimer';del.className='danger';del.onclick=()=>{if(!confirm('Supprimer « '+item.name+' » ?'))return;const d=load();d[section]=(d[section]||[]).filter(x=>x.id!==item.id);save(d);reset();render()};buttons.append(edit,del);row.append(buttons);$('list').append(row)})}$('editor').onsubmit=e=>{e.preventDefault();const d=load(),arr=d[section]||[],id=$('entryId').value||String(Date.now());const item={id};fields.forEach(f=>item[f]=$(f).value.trim());const i=arr.findIndex(x=>x.id===id);if(i===-1)arr.push(item);else arr[i]=item;d[section]=arr;try{save(d);$('entryId').value=id;$('status').textContent='Fiche enregistrée localement (non publiée).';render()}catch{$('status').textContent='Impossible d’enregistrer dans ce navigateur.'}};render();
</script></body></html>
