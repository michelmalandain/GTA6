<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Missions — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(rgba(15,4,28,.83),rgba(15,4,28,.90)),url("admin-missions-fond.png") center top / cover fixed no-repeat;background-color:#14051f;color:#fff;font-family:Arial,sans-serif}header{padding:24px 20px;text-align:center;border-bottom:2px solid #ef72c8;box-shadow:0 0 20px #d02eac55}header h1{font:italic bold clamp(25px,4vw,44px) Georgia,serif;color:#ffd48b;margin:0 0 12px;text-shadow:0 0 15px #d36c24}.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}a.navlink,button{display:inline-block;padding:11px 18px;color:#fff;background:linear-gradient(#4d225d,#210e30);border:1px solid #e99cda;border-radius:7px;text-decoration:none;cursor:pointer;font-size:15px}a.navlink:hover,button:hover{box-shadow:0 0 12px #f778e6}main{width:min(1000px,94%);margin:28px auto}.card{background:#210e30ed;border:1px solid #db80d3;border-radius:15px;padding:24px;margin-bottom:20px;box-shadow:0 0 20px #ae34a340}h2{font:italic bold 27px Georgia,serif;color:#ffd48b;margin-top:0}label{display:block;color:#ffe0ad;margin:15px 0 6px}input,textarea,select{display:block;width:100%;padding:12px;background:#12071d;color:white;border:1px solid #b47ab6;border-radius:6px;font:16px Arial,sans-serif}textarea{min-height:120px;resize:vertical}.muted{color:#d8c1dd;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.entry{border-top:1px solid #76517e;padding:15px 0}.entry strong{color:#ffe1ac}.entry p{color:#dcc9df;white-space:pre-wrap}.status{color:#ffe1ac;min-height:22px}.danger{border-color:#ff9494}.preview{max-width:240px;max-height:160px;object-fit:contain;margin-top:10px;border-radius:6px}@media(max-width:600px){.card{padding:15px}}
</style></head><body><header><h1>Administration — Missions</h1><nav class="nav"><a class="navlink" href="admin.html">Retour à l'administration</a><a class="navlink" href="index.html">Accueil</a></nav></header><main><section class="card"><h2>Ajouter ou modifier une fiche</h2><p class="muted">Les fiches créées ici sont des brouillons enregistrés dans ce navigateur. Elles ne sont pas encore publiées sur le site.</p><form id="editor"><input type="hidden" id="entryId"><label for="name">Titre / Nom</label><input id="name" maxlength="160" required><label for="kind">Catégorie</label><select id="kind"><option>Missions principales</option><option>Missions secondaires</option></select><label for="summary">Description / Biographie</label><textarea id="summary"></textarea><label for="place">Lieu / Localisation</label><input id="place"><label for="image">Image (nom de fichier ou URL autorisée)</label><input id="image" placeholder="exemple.png"><img id="preview" class="preview" alt="Aperçu de l’image" hidden><label for="video">Vidéo — SPOILER SOLUTION (adresse)</label><input id="video" type="url" placeholder="https://…"><div class="actions"><button type="submit">Valider</button><button type="button" id="new">Nouvelle fiche</button></div></form><p id="status" class="status" aria-live="polite"></p></section><section class="card"><h2>Fiches enregistrées</h2><div id="list"></div></section></main><script>
'use strict';const section='missions',key='leonida-admin-brouillons-v1',fields=['name','kind','summary','place','image','video'];const $=id=>document.getElementById(id);function load(){try{return JSON.parse(localStorage.getItem(key))||'{}')}catch{return {}}}function save(d){localStorage.setItem(key,JSON.stringify(d))}function reset(){$('editor').reset();$('entryId').value='';$('status').textContent='';$('preview').hidden=true}function preview(){const v=$('image').value.trim();if(v && (/^https:\/\//.test(v)||/^[\w./-]+\.(png|jpg|jpeg|webp)$/i.test(v))){$('preview').src=v;$('preview').hidden=false}else $('preview').hidden=true}$('image').addEventListener('change',preview);$('new').onclick=reset;function render(){const items=load()[section]||[];$('list').replaceChildren();if(!items.length){$('list').textContent='Aucune fiche enregistrée.';return}items.forEach(item=>{const row=document.createElement('div');row.className='entry';const strong=document.createElement('strong');strong.textContent=item.name+' — '+item.kind;row.append(strong);if(item.summary){const para=document.createElement('p');para.textContent=item.summary;row.append(para)}const buttons=document.createElement('div');buttons.className='actions';const edit=document.createElement('button');edit.textContent='Modifier';edit.onclick=()=>{$('entryId').value=item.id;fields.forEach(f=>$(f).value=item[f]||'');preview();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.textContent='Supprimer';del.className='danger';del.onclick=()=>{if(!confirm('Supprimer « '+item.name+' » ?'))return;const d=load();d[section]=(d[section]||[]).filter(x=>x.id!==item.id);save(d);reset();render()};buttons.append(edit,del);row.append(buttons);$('list').append(row)})}$('editor').onsubmit=e=>{e.preventDefault();const d=load(),arr=d[section]||[],id=$('entryId').value||String(Date.now());const item={id};fields.forEach(f=>item[f]=$(f).value.trim());const i=arr.findIndex(x=>x.id===id);if(i===-1)arr.push(item);else arr[i]=item;d[section]=arr;try{save(d);$('entryId').value=id;$('status').textContent='Fiche enregistrée localement (non publiée).';render()}catch{$('status').textContent='Impossible d’enregistrer dans ce navigateur.'}};render();
</script></body></html>
