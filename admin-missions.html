<!doctype html><html lang="fr"><meta charset="utf-8"><title>Import missions</title><style>body{background:#251333;color:white;font:18px Arial;padding:40px}input,button{padding:12px;margin:8px}</style><h1>Importer le catalogue des missions</h1><p>Remplace les missions existantes. Les autres rubriques restent intactes.</p><input id="token" type="password" placeholder="Jeton Cloudflare"><button id="go">Importer</button><pre id="status"></pre><script>document.getElementById('go').onclick=async()=>{if(!confirm('Remplacer le catalogue des missions ?'))return;const status=document.getElementById('status');try{const data=await fetch('missions-catalogue.json').then(r=>{if(!r.ok)throw Error('JSON absent');return r.json()});const r=await fetch('https://gta6worker.michelmalandain.workers.dev/missions/catalogue',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.getElementById('token').value},body:JSON.stringify({missions:data})});status.textContent=await r.text()}catch(e){status.textContent=e.message}};</script></html>
