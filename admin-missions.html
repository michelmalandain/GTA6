<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Missions — Leonida</title><style>body{background:#170a25;color:#fff;font:17px Arial,sans-serif;max-width:900px;margin:35px auto;padding:15px}h1{color:#ff9ae3}button,input{padding:12px;border-radius:8px;margin:6px 0;background:#331344;color:white;border:1px solid #ff91dc}button{cursor:pointer}button:disabled{opacity:.4}pre{white-space:pre-wrap;background:#281331;padding:15px;border-radius:10px}label{display:block;margin:15px 0}a{color:#ffa5e6}</style><h1>Import des missions GTA Base</h1><p>Fusion non destructive : les missions existantes sont conservées. Les nouvelles fiches sont ajoutées sans supprimer ni modifier les anciennes.</p><label>Fichier JSON du catalogue <input id="file" type="file" accept=".json,application/json"></label><label>Jeton administrateur <input id="token" type="password" autocomplete="off" placeholder="Jeton Cloudflare"></label><button id="preview">1. Prévisualiser</button> <button id="apply" disabled>2. Confirmer l'import</button><p><a href="missions.html">Retour aux missions</a></p><pre id="status">Choisis le fichier missions-catalogue.json du ZIP.</pre><script>const API='https://gta6worker.michelmalandain.workers.dev/missions/import-batch';let rows=null,previewed=false;const $=id=>document.getElementById(id),status=$('status');$('file').onchange=()=>{rows=null;previewed=false;$('apply').disabled=true};async function send(mode){try{const token=$('token').value.trim();if(!token)throw Error('Jeton requis');if(!rows){const file=$('file').files[0];if(!file)throw Error('Sélectionne missions-catalogue.json');const data=JSON.parse(await file.text());rows=Array.isArray(data)?data:data.missions;if(!Array.isArray(rows))throw Error('Fichier JSON incorrect')}status.textContent='Vérification en cours…';const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({missions:rows,mode})});const result=await r.json();if(!r.ok)throw Error(result.error||'Erreur HTTP '+r.status);status.textContent=(mode==='preview'?'PRÉVISUALISATION — aucune écriture':'IMPORT EFFECTUÉ')+'\nFiches dans le fichier : '+rows.length+'\nNouvelles : '+result.added+'\nDéjà présentes et conservées : '+result.kept+'\nTotal après fusion : '+result.total;if(mode==='preview'){previewed=true;$('apply').disabled=false}else{$('apply').disabled=true;previewed=false}}catch(e){status.textContent='Erreur : '+e.message;$('apply').disabled=true;previewed=false}}$('preview').onclick=()=>send('preview');$('apply').onclick=()=>{if(previewed&&confirm('Confirmer l’ajout des missions manquantes dans Cloudflare ?'))send('apply')};</script></html>
