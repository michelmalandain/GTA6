<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missions — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}body{margin:0;background:#16051e;color:#fff;font-family:Georgia,serif}.scene{position:relative;width:100%;max-width:1648px;margin:auto}.scene>img{display:block;width:100%;height:auto}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:2}.hotspot:focus-visible{outline:3px solid #fff;outline-offset:-3px}.nav{top:19.6%;height:6%;}.tab{top:30.7%;height:7.1%;}.row{left:31.8%;width:65.7%;height:7.4%;top:40%;}.row:hover,.row:focus-visible{background:rgba(255,96,218,.12);box-shadow:inset 0 0 16px #ff58e8;border-radius:13px}.row-label{position:absolute;left:34%;top:40.3%;width:54%;height:7%;display:flex;align-items:center;gap:1.5%;pointer-events:none;font-size:clamp(10px,2.15vw,31px);font-style:italic;text-shadow:2px 2px 4px #000}.row-label small{font-size:.5em;font-style:normal;color:#ffcc76;display:block}.row-label .number{font-size:.7em;color:#ffcf6e}.tab[aria-selected="true"]{box-shadow:inset 0 0 20px rgba(255,51,220,.55);border-radius:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#260a34;border:1px solid #f68be9;border-radius:12px;padding:12px 22px;z-index:10;display:none;text-align:center}.dialog-back{position:fixed;inset:0;background:#09020ccf;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.dialog{background:linear-gradient(150deg,#351043,#10091b);border:2px solid #ef8cda;box-shadow:0 0 32px #f328b96e;border-radius:16px;padding:24px;max-width:660px;width:100%;max-height:90vh;overflow:auto}.dialog{max-width:820px}.mission-image{width:100%;max-height:270px;object-fit:cover;border-radius:10px;border:1px solid #a67b4e;margin:10px 0}.spoiler-video{display:none;margin:14px 0;aspect-ratio:16/9}.spoiler-video iframe{width:100%;height:100%;border:0;border-radius:10px}.dialog h2{margin:0 0 14px;color:#ffd28c}.dialog p{line-height:1.6}.dialog button{background:#3c1749;border:1px solid #ff84df;color:#fff;border-radius:8px;padding:10px 20px;cursor:pointer;font:inherit}.dialog button:hover{background:#6c246d}.dialog .close{float:right}.muted{color:#d5bdd6}.badge{display:inline-block;color:#ffca83;font-size:.9em;border:1px solid #c78c55;padding:4px 8px;border-radius:8px}.test-note{text-align:center;font:14px Arial,sans-serif;color:#d4b5d6;padding:14px}.nav:hover{background:#f69bfa20;border-radius:8px}@media(max-width:650px){.scene{min-width:760px}.scroll{overflow-x:auto}.row-label{font-size:18px}}

/* Menu superposé au bandeau du PNG : même style que sur Actualités, sans Missions. */
.menu-gta{position:absolute;left:0;width:100%;top:19.55%;height:6.1%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.35%;z-index:20;padding:.25% .55%;background:#160920;border-top:2px solid #f95dd7;border-bottom:2px solid #f95dd7;box-shadow:0 0 14px #f43cb977}
.menu-gta a{display:flex;align-items:center;justify-content:center;min-width:0;height:100%;padding:0 2px;background:linear-gradient(180deg,#341342,#160a25);border:1px solid #f49bdc;border-radius:6px;color:#fff3fb;text-decoration:none;text-align:center;font:italic 700 clamp(7px,1.17vw,18px)/1.1 Georgia,serif;text-shadow:0 1px 3px #000;white-space:nowrap;box-shadow:inset 0 0 8px #ff5aca22}
.menu-gta a:hover,.menu-gta a:focus-visible{border-color:#ffacee;box-shadow:0 0 13px #ff5aca,inset 0 0 9px #ff5aca55;outline:none}
@media(max-width:650px){.menu-gta a{font-size:9px}}

/* Liste réelle Cloudflare, superposée à la zone de liste du décor validé. */
.mission-list{position:absolute;left:31.8%;top:39.6%;width:65.7%;height:49%;overflow-y:auto;z-index:4;padding:0 .5% 1%;scrollbar-color:#c86da9 #1b0a29}
.mission-item{display:flex;align-items:center;gap:2%;width:100%;min-height:15%;padding:1.2% 2%;margin:0 0 1%;border:1px solid #d59b62;border-radius:10px;background:rgba(23,7,34,.96);color:white;text-align:left;cursor:pointer;font-family:Georgia,serif;box-shadow:inset 0 0 12px #ea4bc32c}
.mission-item:hover,.mission-item:focus-visible{border-color:#ffa6e6;box-shadow:0 0 14px #ff4bd0;outline:none}
.mission-item img{width:15%;aspect-ratio:16/9;object-fit:cover;border:1px solid #e2b078;border-radius:5px;flex-shrink:0}
.mission-item .number{color:#ffcf6e;font-size:clamp(12px,1.4vw,20px)}
.mission-item .name{font-size:clamp(13px,1.9vw,29px);font-weight:bold;font-style:italic}
.mission-item small{display:block;color:#ffcc76;font-size:clamp(10px,.95vw,15px);font-style:normal;margin-top:3px}
.mission-empty{padding:5%;text-align:center;background:rgba(20,7,32,.96);color:#f8dcae;border:1px solid #d59b62;border-radius:12px;font:clamp(13px,1.3vw,18px) Arial,sans-serif}
.mission-item .placeholder{width:15%;aspect-ratio:16/9;border:1px solid #956b6f;border-radius:5px;background:#210f2d;flex-shrink:0}
@media(max-width:650px){.mission-item .name{font-size:17px}.mission-item small{font-size:11px}.mission-item .number{font-size:13px}}
/* Suppression réservée à l'administrateur, depuis la fiche détaillée. */
.delete-area{margin-top:22px;padding-top:17px;border-top:1px solid #795076}
.dialog .delete-trigger{border-color:#d88b8b;color:#ffe4e4;background:#482031}
.delete-auth{margin-top:14px;padding:16px;border:1px solid #a97484;border-radius:10px;background:#190d21}
.delete-auth label{display:block;margin-bottom:8px;color:#ffe0b0;font:15px Arial,sans-serif}
.delete-auth input{width:100%;padding:11px;color:white;background:#120f20;border:1px solid #dfb076;border-radius:6px;font:16px Arial,sans-serif}
.delete-auth .delete-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.delete-auth .delete-status{color:#ffe0b0;font:14px Arial,sans-serif;min-height:20px;margin:10px 0 0}
/* Ajustements validés : panneau sans dorures ni flèches, onglets assortis au menu. */
.scene::after{content:"";position:absolute;z-index:3;left:30.8%;top:27.1%;width:68.6%;height:66%;background:#170a25;border:0;border-radius:0;pointer-events:none}
.mission-count{position:absolute;z-index:8;left:32%;top:27.2%;width:66%;height:3.3%;display:flex;align-items:center;justify-content:center;text-align:center;font:700 clamp(13px,1.65vw,26px)/1.15 Georgia,serif;color:#fff0fa;text-shadow:0 0 9px #ff5aca}
.hotspot.tab{top:31%;height:6.5%;z-index:8;display:flex;align-items:center;justify-content:center;padding:0 1%;background:linear-gradient(180deg,#341342,#160a25);border:1px solid #f49bdc;border-radius:6px;color:#fff3fb;font:italic 700 clamp(12px,1.4vw,22px)/1.1 Georgia,serif;text-shadow:0 1px 3px #000;box-shadow:inset 0 0 8px #ff5aca22}
.hotspot.tab:hover,.hotspot.tab:focus-visible,.hotspot.tab[aria-selected="true"]{border-color:#ffacee;box-shadow:0 0 13px #ff5aca,inset 0 0 9px #ff5aca55;outline:none}
.mission-list{z-index:8;left:32%;top:39%;width:66%;height:49%;padding:0 .5% 1%;border:0;background:transparent}
.mission-item{border:0;border-radius:5px;background:#261132;box-shadow:none}
.mission-item:hover,.mission-item:focus-visible{border:0;box-shadow:inset 0 0 0 1px #ffacee,0 0 12px #ff5aca}
.mission-item img,.mission-item .placeholder{border:0}
.mission-empty{border:0;background:#261132}
@media(max-width:650px){.mission-count{font-size:14px}.hotspot.tab{font-size:13px}}

/* Agrandissement du tableau uniquement, sans modifier les missions. */
.missions-expand{position:absolute;z-index:12;left:91%;top:31%;width:6%;height:6.5%;display:flex;align-items:center;justify-content:center;padding:0;background:linear-gradient(180deg,#341342,#160a25);border:1px solid #f49bdc;border-radius:5px;color:#fff3fb;cursor:pointer;font:700 clamp(22px,2.5vw,38px) Arial,sans-serif;box-shadow:0 0 7px #ff5aca55}
.missions-expand:hover,.missions-expand:focus-visible{box-shadow:0 0 13px #ff5aca;outline:none}
.scene.missions-expanded{position:fixed;inset:0;z-index:100;width:100%;max-width:none;height:100dvh;background:#170a25;overflow:hidden}
.scene.missions-expanded>img,.scene.missions-expanded .menu-gta{display:none}
.scene.missions-expanded::after{display:none}
.scene.missions-expanded .mission-count{left:4%;top:3%;width:92%;height:7%;font-size:clamp(18px,2.2vw,34px)}
.scene.missions-expanded .hotspot.tab{top:12%;height:8%;font-size:clamp(15px,1.6vw,26px)}
.scene.missions-expanded #mainTab{left:4%!important;width:45%!important}
.scene.missions-expanded #sideTab{left:51%!important;width:45%!important}
.scene.missions-expanded .mission-list{left:4%;top:23%;width:92%;height:73%;padding:1%}
.scene.missions-expanded .missions-expand{position:absolute;top:3%;right:1%;width:38px;height:38px;font-size:24px}
.scene.missions-expanded .mission-item{min-height:85px;padding:10px 18px}
.scene.missions-expanded .mission-item img,.scene.missions-expanded .mission-item .placeholder{width:110px}
.scene.missions-expanded .mission-item .name{font-size:clamp(18px,2vw,30px)}
@media(max-width:650px){.missions-expand{min-width:24px;min-height:24px}}
</style></head><body><div class="scroll"><main class="scene" aria-label="Page des missions GTA VI, démonstration avec GTA V"><img src="mission.png" alt="Décor validé : Vice City, Morticia, menu et liste des missions">
<nav class="menu-gta" aria-label="Navigation principale">
<a href="index.html">Accueil</a><a href="actualites.html">Actualités</a><a href="personnages.html">Personnages</a><a href="animaux.html">Animaux</a><a href="objets.html">Objets</a><a href="admin.html">Administration</a>
</nav>
<button type="button" id="missionsExpand" class="missions-expand" aria-label="Agrandir le tableau des missions" title="Agrandir le tableau">□</button>
<div class="mission-count" id="missionInfo" role="status" aria-live="polite">Chargement du nombre de missions…</div>
<button class="hotspot tab" style="left:34%;width:27.5%" id="mainTab" aria-label="Missions principales" aria-selected="true" type="button">Missions principales</button>
<button class="hotspot tab" style="left:62.5%;width:27.5%" id="sideTab" aria-label="Missions secondaires" aria-selected="false" type="button">Missions secondaires</button>
<div id="missionList" class="mission-list" aria-live="polite"><div class="mission-empty">Chargement des missions…</div></div>
</main></div><div id="toast" class="toast" role="status"></div>
<div id="overlay" class="dialog-back" role="dialog" aria-modal="true" aria-labelledby="missionTitle"><article class="dialog"><button class="close" id="close" type="button">Fermer</button><span class="badge" id="missionKind"></span><h2 id="missionTitle"></h2><img id="missionImage" class="mission-image" alt="Illustration de la mission" hidden><p id="missionPlace"></p><p id="missionSummary" style="white-space:pre-wrap"></p><button type="button" id="spoilerToggle" aria-expanded="false" hidden>SPOILER SOLUTION</button><div id="spoilerVideo" class="spoiler-video"><iframe id="solutionFrame" title="Solution vidéo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="delete-area"><button type="button" id="deleteTrigger" class="delete-trigger">Supprimer cette mission</button><div id="deleteAuth" class="delete-auth" hidden><label for="deleteToken">Jeton administrateur Cloudflare</label><input id="deleteToken" type="password" autocomplete="off" spellcheck="false" placeholder="Saisir le jeton administrateur"><div class="delete-actions"><button type="button" id="deleteToggle">Afficher le jeton</button><button type="button" id="deleteConfirm" class="delete-trigger">Confirmer la suppression</button><button type="button" id="deleteCancel">Annuler</button></div><p id="deleteStatus" class="delete-status" role="status" aria-live="polite"></p></div></div><p><button id="closeBottom" type="button">Retour à la liste</button></p></article></div>
<script>
'use strict';
const API='https://gta6worker.michelmalandain.workers.dev/missions';
const main=document.getElementById('mainTab'),side=document.getElementById('sideTab');
const list=document.getElementById('missionList'),overlay=document.getElementById('overlay'),toast=document.getElementById('toast');
const spoilerToggle=document.getElementById('spoilerToggle'),spoilerVideo=document.getElementById('spoilerVideo'),solutionFrame=document.getElementById('solutionFrame');
let missions=[],currentType='main',lastFocus=null,currentVideo='',currentMission=null;
function showToast(message){toast.textContent=message;toast.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.style.display='none',3500)}
function safeImage(value){if(typeof value!=='string')return '';const v=value.trim();if(/^https:\/\//i.test(v))return v;if(/^(?!\/)(?!.*\.\.)[a-zA-Z0-9_./-]+\.(png|jpe?g|webp)$/i.test(v))return v;return ''}
function videoEmbed(value){if(typeof value!=='string'||!value.trim())return '';try{const u=new URL(value);if(u.protocol!=='https:')return '';let id='';if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/)?.[1]||''}else if(u.hostname==='youtu.be'){id=u.pathname.slice(1)}return /^[\w-]{11}$/.test(id)?'https://www.youtube-nocookie.com/embed/'+id+'?rel=0':''}catch{return ''}}
function hideSolution(){spoilerVideo.style.display='none';solutionFrame.removeAttribute('src');spoilerToggle.setAttribute('aria-expanded','false');spoilerToggle.textContent='SPOILER SOLUTION'}
function closeMission(){overlay.style.display='none';hideSolution();resetDelete();if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function openMission(item,button){lastFocus=button;currentMission=item;resetDelete();hideSolution();document.getElementById('missionTitle').textContent=item.name||'Sans titre';document.getElementById('missionKind').textContent=item.kind||'Mission';document.getElementById('missionPlace').textContent=item.place?'Lieu : '+item.place:'';document.getElementById('missionSummary').textContent=item.summary||'Aucune description disponible.';const img=document.getElementById('missionImage'),src=safeImage(item.image);img.hidden=!src;if(src)img.src=src;else img.removeAttribute('src');currentVideo=videoEmbed(item.video);spoilerToggle.hidden=!currentVideo;overlay.style.display='flex';document.getElementById('close').focus()}
function render(){const selected=missions.filter(m=>currentType==='main'?m.kind!=='Missions secondaires':m.kind==='Missions secondaires');list.replaceChildren();if(!selected.length){const empty=document.createElement('div');empty.className='mission-empty';empty.textContent='Aucune mission '+(currentType==='main'?'principale':'secondaire')+' enregistrée.';list.append(empty);return}selected.forEach((item,i)=>{const button=document.createElement('button');button.type='button';button.className='mission-item';const img=safeImage(item.image);if(img){const pic=document.createElement('img');pic.src=img;pic.alt='';pic.loading='lazy';pic.onerror=()=>pic.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder'}));button.append(pic)}else{const placeholder=document.createElement('span');placeholder.className='placeholder';button.append(placeholder)}const number=document.createElement('span');number.className='number';number.textContent=String(i+1).padStart(2,'0');button.append(number);const wrap=document.createElement('span');wrap.className='name';wrap.textContent=item.name||'Sans titre';const small=document.createElement('small');small.textContent=item.place||item.kind||'';wrap.append(small);button.append(wrap);button.addEventListener('click',()=>openMission(item,button));list.append(button)})}
function switchTab(type){currentType=type;main.setAttribute('aria-selected',String(type==='main'));side.setAttribute('aria-selected',String(type==='side'));render()}
const deleteTrigger=document.getElementById('deleteTrigger'),deleteAuth=document.getElementById('deleteAuth'),deleteToken=document.getElementById('deleteToken'),deleteConfirm=document.getElementById('deleteConfirm'),deleteStatus=document.getElementById('deleteStatus'),deleteToggle=document.getElementById('deleteToggle');
function resetDelete(){deleteAuth.hidden=true;deleteToken.value='';deleteToken.type='password';deleteToggle.textContent='Afficher le jeton';deleteStatus.textContent='';deleteConfirm.disabled=false;deleteTrigger.disabled=false}
deleteTrigger.addEventListener('click',()=>{deleteAuth.hidden=false;deleteToken.focus()});
document.getElementById('deleteCancel').addEventListener('click',()=>{resetDelete();deleteTrigger.focus()});
deleteToggle.addEventListener('click',()=>{deleteToken.type=deleteToken.type==='password'?'text':'password';deleteToggle.textContent=deleteToken.type==='password'?'Afficher le jeton':'Masquer le jeton'});
deleteConfirm.addEventListener('click',async()=>{
  if(!currentMission)return;
  const token=deleteToken.value.trim();
  if(!token){deleteStatus.textContent='Saisis ton jeton administrateur.';deleteToken.focus();return}
  const mission=currentMission;
  if(!window.confirm('Supprimer définitivement la mission « '+(mission.name||'Sans titre')+' » de Cloudflare ?'))return;
  deleteConfirm.disabled=true;deleteStatus.textContent='Suppression en cours sur Cloudflare…';
  try{
    const response=await fetch(API+'/'+encodeURIComponent(mission.id),{method:'DELETE',headers:{Authorization:'Bearer '+token},cache:'no-store'});
    let result={};try{result=await response.json()}catch{}
    if(!response.ok||result.ok!==true){throw new Error(response.status===401?'Jeton administrateur refusé (401).':result.error||'Suppression refusée (HTTP '+response.status+').')}
    deleteToken.value='';deleteStatus.textContent='Mission supprimée. Actualisation de la liste…';
    const fresh=await fetch(API,{cache:'no-store'});
    if(fresh.ok){const data=await fresh.json();if(Array.isArray(data.missions))missions=data.missions;else missions=missions.filter(m=>m.id!==mission.id)}
    else missions=missions.filter(m=>m.id!==mission.id);
    document.getElementById('missionInfo').textContent=missions.length+' mission'+(missions.length>1?'s':'')+' enregistrée'+(missions.length>1?'s':'')+' dans Le Carnet de Leonida.';
    closeMission();render();showToast('Mission supprimée de Cloudflare.');
  }catch(err){deleteStatus.textContent=err.message+' La mission reste affichée.'}
  finally{deleteConfirm.disabled=false}
});
main.addEventListener('click',()=>switchTab('main'));side.addEventListener('click',()=>switchTab('side'));
spoilerToggle.addEventListener('click',()=>{if(spoilerVideo.style.display==='block'){hideSolution()}else if(currentVideo){spoilerVideo.style.display='block';solutionFrame.src=currentVideo;spoilerToggle.setAttribute('aria-expanded','true');spoilerToggle.textContent='Masquer la solution'}});
document.getElementById('close').onclick=closeMission;document.getElementById('closeBottom').onclick=closeMission;overlay.addEventListener('click',e=>{if(e.target===overlay)closeMission()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.style.display==='flex')closeMission()});
async function loadMissions(){try{const res=await fetch(API,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.missions))throw new Error('Format de données inattendu');missions=data.missions;render();document.getElementById('missionInfo').textContent=missions.length+' mission'+(missions.length>1?'s':'')+' enregistrée'+(missions.length>1?'s':'')+' dans Le Carnet de Leonida.'}catch(err){list.replaceChildren();const div=document.createElement('div');div.className='mission-empty';div.textContent='Impossible de charger les missions depuis Cloudflare. Réessaie en actualisant la page.';list.append(div);document.getElementById('missionInfo').textContent='Erreur de chargement : '+err.message}}

const missionsExpand=document.getElementById('missionsExpand');
const missionsScene=document.querySelector('.scene');
function setMissionsExpanded(expanded){
  missionsScene.classList.toggle('missions-expanded',expanded);
  missionsExpand.textContent=expanded?'×':'□';
  missionsExpand.setAttribute('aria-label',expanded?'Réduire le tableau des missions':'Agrandir le tableau des missions');
  missionsExpand.title=expanded?'Réduire le tableau':'Agrandir le tableau';
  document.body.style.overflow=expanded?'hidden':'';
}
missionsExpand.addEventListener('click',()=>setMissionsExpanded(!missionsScene.classList.contains('missions-expanded')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&missionsScene.classList.contains('missions-expanded')&&overlay.style.display!=='flex')setMissionsExpanded(false)});

loadMissions();
</script></body></html>
