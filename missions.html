function catalogueEntry(m){return Object.hasOwn(catalogueById,m.id)?catalogueById[m.id]:Object.hasOwn(catalogueByName,m.name)?catalogueByName[m.name]:null;}
function missionImage(m){return safeImage(m.image)||safeImage(catalogueEntry(m)?.image);}
function enrichMissions(rows){return rows.map(m=>({...m,chapter:m.chapter||catalogueEntry(m)?.chapter||""}));}
function imageFallback(pic,m,onFailure){const fallback=safeImage(catalogueEntry(m)?.image);pic.onerror=()=>{if(fallback&&pic.getAttribute("src")!==fallback){pic.src=fallback;}else{pic.onerror=null;onFailure();}};}
function videoEmbed(value){if(typeof value!=='string'||!value.trim())return '';try{const u=new URL(value);if(u.protocol!=='https:')return '';let id='';if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/)?.[1]||''}else if(u.hostname==='youtu.be'){id=u.pathname.slice(1)}return /^[\w-]{11}$/.test(id)?'https://www.youtube-nocookie.com/embed/'+id+'?rel=0':''}catch{return ''}}
function hideSolution(){spoilerVideo.style.display='none';solutionFrame.removeAttribute('src');spoilerToggle.setAttribute('aria-expanded','false');spoilerToggle.textContent='SPOILER SOLUTION'}
function closeMission(){overlay.style.display='none';hideSolution();resetDelete();if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function openMission(item,button){lastFocus=button;currentMission=item;resetDelete();hideSolution();document.getElementById('missionTitle').textContent=item.name||'Sans titre';document.getElementById('missionKind').textContent=[item.chapter,item.kind].filter(Boolean).join(' — ');document.getElementById('missionPlace').textContent=item.place?'Lieu : '+item.place:'';document.getElementById('missionSummary').textContent=item.summary||'Aucune description disponible.';const img=document.getElementById('missionImage'),src=missionImage(item);imageFallback(img,item,()=>{img.hidden=true;});img.hidden=!src;if(src)img.src=src;else img.removeAttribute('src');const guide=document.getElementById('guideLink'),anchor=document.getElementById('guideAnchor');let source='';try{const u=new URL(item.source||'');if(u.protocol==='https:'&&['gtabase.com','www.gtabase.com','www.powerpyx.com','powerpyx.com'].includes(u.hostname))source=u.href}catch{}guide.hidden=!source;if(source){anchor.href=source;anchor.textContent=source.includes('powerpyx.com')?'VOIR LA SOLUCE POWERPYX ↗':'VOIR LA SOLUCE GTA BASE ↗';}else anchor.removeAttribute('href');currentVideo=videoEmbed(item.video);spoilerToggle.hidden=!currentVideo;overlay.style.display='flex';document.getElementById('close').focus()}
function missionOrder(m){const n=Number(m.number);if(Number.isFinite(n)&&n>0)return n;const match=String(m.name||'').match(/^\s*(\d{1,3})\s*[-.: ]/);return match?Number(match[1]):/\bprologue\b/i.test(m.name||'')?1:Number.POSITIVE_INFINITY}
function render(){const selected=missions.filter(m=>currentType==='main'?m.kind!=='Missions secondaires':m.kind==='Missions secondaires').sort((a,b)=>(['Prologue','Chapitre 1','Chapitre 2','Chapitre 3','Chapitre 4','Chapitre 5','Tous chapitres'].indexOf(a.chapter)-['Prologue','Chapitre 1','Chapitre 2','Chapitre 3','Chapitre 4','Chapitre 5','Tous chapitres'].indexOf(b.chapter))||missionOrder(a)-missionOrder(b));list.replaceChildren();if(!selected.length){const empty=document.createElement('div');empty.className='mission-empty';empty.textContent='Aucune mission '+(currentType==='main'?'principale':'secondaire')+' enregistrée.';list.append(empty);return}let chapter=null;selected.forEach((item,i)=>{if(chapter!==item.chapter){chapter=item.chapter;const heading=document.createElement("div");heading.className="chapter-heading";heading.textContent=chapter||"Chapitre non renseigné";list.append(heading);}const button=document.createElement('button');button.type='button';button.className='mission-item';const img=missionImage(item);if(img){const pic=document.createElement('img');pic.src=img;pic.alt='';pic.loading='lazy';imageFallback(pic,item,()=>pic.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder'})));button.append(pic)}else{const placeholder=document.createElement('span');placeholder.className='placeholder';button.append(placeholder)}const number=document.createElement('span');number.className='number';number.textContent=String(Number.isFinite(missionOrder(item))?missionOrder(item):i+1).padStart(2,'0');button.append(number);const wrap=document.createElement('span');wrap.className='name';wrap.textContent=item.name||'Sans titre';const small=document.createElement('small');small.textContent=item.place||item.kind||'';wrap.append(small);button.append(wrap);button.addEventListener('click',()=>openMission(item,button));list.append(button)})}

function resetDelete(){deleteAuth.hidden=true;deleteToken.value='';deleteToken.type='password';deleteToggle.textContent='Afficher le jeton';deleteStatus.textContent='';deleteConfirm.disabled=false;deleteTrigger.disabled=false}
deleteTrigger.addEventListener('click',()=>{deleteAuth.hidden=false;deleteToken.focus()});
document.getElementById('deleteCancel').addEventListener('click',()=>{resetDelete();deleteTrigger.focus()});
deleteToggle.addEventListener('click',()=>{deleteToken.type=deleteToken.type==='password'?'text':'password';deleteToggle.textContent=deleteToken.type==='password'?'Afficher le jeton':'Masquer le jeton'});
deleteConfirm.addEventListener('click',async()=>{
  if(!currentMission)return;
  const token=deleteToken.value.trim();
  if(!token){deleteStatus.textContent='Saisis ton jeton administrateur.';deleteToken.focus();return}
  const mission=currentMission;
  if(!window.confirm('Supprimer définitivement la mission « '+(mission.name||'Sans titre')+' » de Cloudflare ?'))return;
  deleteConfirm.disabled=true;deleteStatus.textContent='Suppression en cours sur Cloudflare…';
  try{
    const response=await fetch(API+'/'+encodeURIComponent(mission.id),{method:'DELETE',headers:{Authorization:'Bearer '+token},cache:'no-store'});
    let result={};try{result=await response.json()}catch{}
    if(!response.ok||result.ok!==true){throw new Error(response.status===401?'Jeton administrateur refusé (401).':result.error||'Suppression refusée (HTTP '+response.status+').')}
    deleteToken.value='';deleteStatus.textContent='Mission supprimée. Actualisation de la liste…';
    const fresh=await fetch(API,{cache:'no-store'});
    if(fresh.ok){const data=await fresh.json();if(Array.isArray(data.missions))missions=enrichMissions(data.missions);else missions=missions.filter(m=>m.id!==mission.id)}
    else missions=missions.filter(m=>m.id!==mission.id);
    document.getElementById('missionInfo').textContent=missions.length+' mission'+(missions.length>1?'s':'')+' enregistrée'+(missions.length>1?'s':'')+' dans Le Carnet de Leonida.';
    closeMission();render();showToast('Mission supprimée de Cloudflare.');
  }catch(err){deleteStatus.textContent=err.message+' La mission reste affichée.'}
  finally{deleteConfirm.disabled=false}
});
main.addEventListener('click',()=>switchTab('main'));side.addEventListener('click',()=>switchTab('side'));
spoilerToggle.addEventListener('click',()=>{if(spoilerVideo.style.display==='block'){hideSolution()}else if(currentVideo){spoilerVideo.style.display='block';solutionFrame.src=currentVideo;spoilerToggle.setAttribute('aria-expanded','true');spoilerToggle.textContent='Masquer la solution'}});
document.getElementById('close').onclick=closeMission;document.getElementById('closeBottom').onclick=closeMission;overlay.addEventListener('click',e=>{if(e.target===overlay)closeMission()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.style.display==='flex')closeMission()});
async function loadMissions(){try{const res=await fetch(API,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.missions))throw new Error('Format de données inattendu');missions=enrichMissions(data.missions);render();document.getElementById('missionInfo').textContent=missions.length+' mission'+(missions.length>1?'s':'')+' enregistrée'+(missions.length>1?'s':'')+' dans Le Carnet de Leonida.'}catch(err){list.replaceChildren();const div=document.createElement('div');div.className='mission-empty';div.textContent='Impossible de charger les missions depuis Cloudflare. Réessaie en actualisant la page.';list.append(div);document.getElementById('missionInfo').textContent='Erreur de chargement : '+err.message}}

const missionsExpand=document.getElementById('missionsExpand');
const missionsScene=document.querySelector('.scene');
function setMissionsExpanded(expanded){
  missionsScene.classList.toggle('missions-expanded',expanded);
  missionsExpand.textContent=expanded?'×':'□';
  missionsExpand.setAttribute('aria-label',expanded?'Réduire le tableau des missions':'Agrandir le tableau des missions');
  missionsExpand.title=expanded?'Réduire le tableau':'Agrandir le tableau';
  document.body.style.overflow=expanded?'hidden':'';
}
missionsExpand.addEventListener('click',()=>setMissionsExpanded(!missionsScene.classList.contains('missions-expanded')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&missionsScene.classList.contains('missions-expanded')&&overlay.style.display!=='flex')setMissionsExpanded(false)});

loadMissions();
</script></body></html>
