x;border:1px solid #ff9be1;border-radius:7px;background:#702065;color:white;cursor:pointer}@media(max-width:800px){.catalog-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.catalog-list{grid-template-columns:1fr}.screen-label{font-size:11px;padding:5px}.catalog-panel{height:80vh}.tile img{height:73px}}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#08030be8}.overlay[hidden]{display:none}.panel{width:min(900px,96vw);max-height:94vh;overflow:auto;border:2px solid #f87cdb;border-radius:16px;padding:24px;background:linear-gradient(145deg,#361044,#130b21);box-shadow:0 0 35px #fa3cbb77;text-align:center}.panel h1{color:#ff9fdf;font-size:clamp(23px,3vw,37px)}.panel p{line-height:1.6;font:16px Arial,sans-serif}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:25px}.actions button,.actions a{display:inline-block;padding:12px 20px;border:1px solid #ff9be1;border-radius:9px;background:#9c247e;color:white;text-decoration:none;cursor:pointer;font:700 15px Arial,sans-serif}.actions button:hover,.actions a:hover{background:#c3339f}.player-panel{width:min(1100px,96vw);padding:16px}.player-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.player-head h2{margin:0;font-size:clamp(16px,2vw,24px)}.player-head button{padding:8px 15px;border:1px solid #ff9be1;border-radius:7px;background:#702065;color:#fff;cursor:pointer}.player{aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}@media(max-width:650px){.screen{gap:1%}.tile .caption{font-size:14px}.panel{padding:14px}.catalog-head h2{font-size:19px}}

/* Catalogue V2 : cartes autonomes, sans chevauchement des miniatures et titres. */
.catalog-panel{position:relative;width:min(1120px,96vw);height:min(84vh,800px);max-height:90svh;overflow:hidden;padding:22px 22px 18px;display:flex;flex-direction:column}
.catalog-head{flex:0 0 auto;padding-bottom:12px;border-bottom:1px solid #874579}
.catalog-list{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;align-items:start;gap:18px;overflow-y:auto;overflow-x:hidden;padding:16px 8px 80px 2px;scrollbar-color:#d76ac5 #281135;scroll-behavior:smooth}
.catalog-list .tile{position:static;display:flex;flex-direction:column;align-self:start;min-width:0;width:100%;height:auto;min-height:0;margin:0;padding:0;overflow:hidden;border:1px solid #c97cbf;border-radius:10px;background:#1c0d2b;text-align:left;box-shadow:0 3px 10px #0005}
.catalog-list .tile img{display:block;flex:none;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center}
.catalog-list .tile .caption{display:-webkit-box;flex:none;min-height:56px;margin:0;padding:10px 11px;color:#fff;font:700 14px/1.35 Arial,sans-serif;overflow:hidden;overflow-wrap:anywhere;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.catalog-list .tile .description{display:-webkit-box;flex:none;max-height:53px;margin:0;padding:0 11px 9px;color:#e9d6eb;font:12px/1.35 Arial,sans-serif;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}

</style></head><body><main class="scene" aria-label="Le repaire de Mortitia — Tips et Tricks"><img class="decor" src="tips.png" alt="Mortitia sur son fauteuil, écran montrant une salle des coffres remplie de lingots et une petite Mortitia"><a class="close-scene" href="index.html" aria-label="Fermer et retourner à l’accueil" title="Fermer" style="background:linear-gradient(135deg,#a51e80,#57146b);border:1px solid #ff95e4;border-radius:30px;display:grid;place-items:center;color:white;text-decoration:none;font:italic 700 clamp(11px,1.2vw,18px) Georgia,serif">Fermer</a><button id="openCatalog" class="screen-trigger" type="button" aria-label="Ouvrir le catalogue de toutes les vidéos"><span class="screen-label">Voir toutes les vidéos</span></button></main>
<section id="spoiler" class="overlay" role="dialog" aria-modal="true" aria-labelledby="spoiler-title"><div class="panel"><h1 id="spoiler-title">ALERTE SPOILERS</h1><p>Les vidéos de cette pièce peuvent dévoiler des secrets, des missions, des lieux ou des éléments de l’histoire de GTA VI.</p><p>Souhaites-tu entrer dans le repaire de Mortitia ?</p><div class="actions"><button id="continue" type="button">Continuer</button><a href="index.html">Retour à l’accueil</a></div></div></section>
<section id="catalogOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Catalogue des vidéos" hidden><div class="panel catalog-panel"><div class="catalog-head"><h2>Toutes les vidéos — Tips & Tricks</h2><button id="closeCatalog" type="button">Fermer</button></div><div id="screen" class="catalog-list" aria-label="Catalogue des vidéos"></div><button id="catalogTop" class="catalog-top" type="button" title="Remonter au début des vidéos">↑ Remonter</button></div></section>
<section id="videoOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Lecteur vidéo" hidden><div class="panel player-panel"><div class="player-head"><h2 id="videoTitle"></h2><button id="closeVideo" type="button">Fermer</button></div><div id="player" class="player"></div></div></section>
<script>
'use strict';
// Vidéos enregistrées dans le Worker Cloudflare.
// Format prévu : [{title:'Titre',url:'https://www.youtube.com/watch?v=...',id:'...'}]
const catalog=document.getElementById('catalogOverlay'),screen=document.getElementById('screen'),spoiler=document.getElementById('spoiler'),overlay=document.getElementById('videoOverlay'),player=document.getElementById('player');
function youtubeId(url){try{const u=new URL(url);const host=u.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtu.be')id=u.pathname.slice(1).split('/')[0];else if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com'){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/)?.[1]||''}return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null}catch{return null}}
function render(videos){screen.replaceChildren();const valid=videos.filter(v=>v&&typeof v.title==='string'&&youtubeId(v.url||''));if(!valid.length){const e=document.createElement('div');e.className='empty';e.textContent='Les premières vidéos Tips & Tricks arrivent bientôt…';screen.append(e);return}valid.forEach(v=>{const id=youtubeId(v.url);const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label','Lire '+v.title);const img=document.createElement('img');img.src='https://img.youtube.com/vi/'+id+'/hqdefault.jpg';img.alt='';img.loading='lazy';const t=document.createElement('span');t.className='caption';t.textContent='▶ '+v.title;b.append(img,t);if(v.description||v.summary){const d=document.createElement('span');d.className='description';d.textContent=String(v.description||v.summary);b.append(d)}b.addEventListener('click',()=>play(v.title,id));screen.append(b)})}
function play(title,id){document.getElementById('videoTitle').textContent=title;const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';frame.title=title;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';player.replaceChildren(frame);overlay.hidden=false;document.getElementById('closeVideo').focus()}
function closePlayer(){overlay.hidden=true;player.replaceChildren()}
document.getElementById('catalogTop').addEventListener('click',()=>screen.scrollTo({top:0,behavior:'smooth'}));
document.getElementById('openCatalog').addEventListener('click',()=>{catalog.hidden=false;screen.scrollTop=0;document.getElementById('closeCatalog').focus()});function closeCatalog(){catalog.hidden=true;document.getElementById('openCatalog').focus()}document.getElementById('closeCatalog').addEventListener('click',closeCatalog);catalog.addEventListener('click',e=>{if(e.target===catalog)closeCatalog()});document.getElementById('closeVideo').addEventListener('click',closePlayer);overlay.addEventListener('click',e=>{if(e.target===overlay)closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!overlay.hidden)closePlayer();else if(!catalog.hidden)closeCatalog()}});
document.getElementById('continue').addEventListener('click',()=>{spoiler.hidden=true;document.querySelector('.close-scene').focus()});
const API='https://gta6worker.michelmalandain.workers.dev';
async function loadTips(){
 try { const r=await fetch(API+'/tips',{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status); const data=await r.json(); render(Array.isArray(data.tips)?data.tips:[]); }
 catch(e){screen.replaceChildren();const box=document.createElement('div');box.className='empty';box.textContent='Vidéos indisponibles pour le moment.';screen.append(box);console.warn('Tips :',e.message);}
}
loadTips();
</script></body></html>
