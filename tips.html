<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tips & Tricks — Le Carnet de Leonida</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#120719;color:#fff;font-family:Georgia,serif}body{display:grid;place-items:center;min-height:100svh}.scene{position:relative;width:min(100vw,177.37vh);aspect-ratio:1648/929;overflow:hidden}.decor{width:100%;height:100%;display:block}.close-scene{position:absolute;top:1.8%;right:1.2%;width:11.1%;height:7%;border:0;background:transparent;cursor:pointer;z-index:5}.close-scene:focus-visible{outline:2px solid #fff;border-radius:24px}.screen{position:absolute;left:55.4%;top:17.2%;width:40.5%;height:31%;z-index:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2%;padding:1%;overflow:hidden}.tile{position:relative;border:1px solid #e28bd8;border-radius:4px;background:#160b2ddc;color:white;cursor:pointer;overflow:hidden;padding:0;display:flex;align-items:flex-end;text-align:left}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile .caption{position:relative;z-index:1;display:block;width:100%;padding:5px;background:#160920e8;font:clamp(8px,.78vw,13px)/1.15 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile:focus-visible{outline:2px solid white}.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;text-align:center;padding:12px;background:#160920d9;font:clamp(11px,1.2vw,20px) Georgia,serif;color:#ffe0f6}.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#08030be8}.overlay[hidden]{display:none}.panel{width:min(900px,96vw);max-height:94vh;overflow:auto;border:2px solid #f87cdb;border-radius:16px;padding:24px;background:linear-gradient(145deg,#361044,#130b21);box-shadow:0 0 35px #fa3cbb77;text-align:center}.panel h1{color:#ff9fdf;font-size:clamp(23px,3vw,37px)}.panel p{line-height:1.6;font:16px Arial,sans-serif}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:25px}.actions button,.actions a{display:inline-block;padding:12px 20px;border:1px solid #ff9be1;border-radius:9px;background:#9c247e;color:white;text-decoration:none;cursor:pointer;font:700 15px Arial,sans-serif}.actions button:hover,.actions a:hover{background:#c3339f}.player-panel{width:min(1100px,96vw);padding:16px}.player-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.player-head h2{margin:0;font-size:clamp(16px,2vw,24px)}.player-head button{padding:8px 15px;border:1px solid #ff9be1;border-radius:7px;background:#702065;color:#fff;cursor:pointer}.player{aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}.screen:has(.empty){cursor:default}@media(max-width:650px){.screen{gap:1%}.tile .caption{font-size:8px}.panel{padding:18px}}
</style></head><body><main class="scene" aria-label="Le repaire de Mortitia — Tips et Tricks"><img class="decor" src="tips.png" alt="Mortitia dans son fauteuil, coffre-fort et écran vidéo"><a class="close-scene" href="index.html" aria-label="Fermer et retourner à l’accueil" title="Fermer"></a><section id="screen" class="screen" aria-label="Vidéos d'astuces, deux colonnes"></section></main>
<section id="spoiler" class="overlay" role="dialog" aria-modal="true" aria-labelledby="spoiler-title"><div class="panel"><h1 id="spoiler-title">ALERTE SPOILERS</h1><p>Les vidéos de cette pièce peuvent dévoiler des secrets, des missions, des lieux ou des éléments de l’histoire de GTA VI.</p><p>Souhaites-tu entrer dans le repaire de Mortitia ?</p><div class="actions"><button id="continue" type="button">Continuer</button><a href="index.html">Retour à l’accueil</a></div></div></section>
<section id="videoOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Lecteur vidéo" hidden><div class="panel player-panel"><div class="player-head"><h2 id="videoTitle"></h2><button id="closeVideo" type="button">Fermer</button></div><div id="player" class="player"></div></div></section>
<script>
'use strict';
// Vidéos enregistrées dans le Worker Cloudflare.
// Format prévu : [{title:'Titre',url:'https://www.youtube.com/watch?v=...',id:'...'}]
const screen=document.getElementById('screen'),spoiler=document.getElementById('spoiler'),overlay=document.getElementById('videoOverlay'),player=document.getElementById('player');
function youtubeId(url){try{const u=new URL(url);const host=u.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtu.be')id=u.pathname.slice(1).split('/')[0];else if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com'){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/)?.[1]||''}return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null}catch{return null}}
function render(videos){screen.replaceChildren();const valid=videos.filter(v=>v&&typeof v.title==='string'&&youtubeId(v.url||'')).slice(0,4);if(!valid.length){const e=document.createElement('div');e.className='empty';e.textContent='Les premières vidéos Tips & Tricks arrivent bientôt…';screen.append(e);return}valid.forEach(v=>{const id=youtubeId(v.url);const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label','Lire '+v.title);const img=document.createElement('img');img.src='https://img.youtube.com/vi/'+id+'/hqdefault.jpg';img.alt='';img.loading='lazy';const t=document.createElement('span');t.className='caption';t.textContent='▶ '+v.title;b.append(img,t);b.addEventListener('click',()=>play(v.title,id));screen.append(b)})}
function play(title,id){document.getElementById('videoTitle').textContent=title;const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0';frame.title=title;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';player.replaceChildren(frame);overlay.hidden=false;document.getElementById('closeVideo').focus()}
function closePlayer(){overlay.hidden=true;player.replaceChildren()}
document.getElementById('closeVideo').addEventListener('click',closePlayer);overlay.addEventListener('click',e=>{if(e.target===overlay)closePlayer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closePlayer()});
document.getElementById('continue').addEventListener('click',()=>{spoiler.hidden=true;document.querySelector('.close-scene').focus()});
const API='https://gta6worker.michelmalandain.workers.dev';
async function loadTips(){
 try { const r=await fetch(API+'/tips',{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status); const data=await r.json(); render(Array.isArray(data.tips)?data.tips:[]); }
 catch(e){screen.replaceChildren();const box=document.createElement('div');box.className='empty';box.textContent='Vidéos indisponibles pour le moment.';screen.append(box);console.warn('Tips :',e.message);}
}
loadTips();
</script></body></html>
