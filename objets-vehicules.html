<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Véhicules — Le Carnet de Leonida</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#13051d;color:#fff;font-family:Georgia,serif}.stage{position:relative;width:min(100%,1670px);margin:auto;overflow:hidden}.stage>img{display:block;width:100%;height:auto}.nav{position:absolute;top:17.65%;left:0;width:100%;height:7.5%;display:grid;grid-template-columns:1fr 1.15fr 1fr 1.4fr 1fr 1fr 1.1fr 1.55fr;gap:.3%;padding:.25% 1%;background:linear-gradient(#170820,#080311);z-index:3}.nav a{display:flex;align-items:center;justify-content:center;min-width:0;color:white;text-decoration:none;font-size:clamp(8px,1.48vw,23px);font-weight:bold;font-style:italic;text-shadow:0 2px 3px #000;border:2px solid #fc65e9;border-radius:18px;background:linear-gradient(#390e4b,#07030c 72%);box-shadow:inset 0 0 9px #d92ed6,0 0 9px #f333c9}.nav a:hover,.nav a:focus-visible{background:#6a176f;outline:1px solid white}.counter{position:absolute;left:36.6%;top:46.5%;width:16.5%;height:5.5%;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.65vw,26px);font-weight:bold;text-shadow:0 0 8px #ff65e3}.panel{position:absolute;left:58.5%;top:29%;width:39.2%;height:63.5%;padding:1.2%;border:2px solid #ef5cda;border-radius:18px;background:linear-gradient(135deg,rgba(21,6,34,.97),rgba(28,8,39,.9));box-shadow:0 0 18px #d21aa5;display:flex;flex-direction:column;gap:1.4%;font-family:Arial,sans-serif}.panel h1{font-size:clamp(14px,2vw,30px);margin:0;text-align:center;color:#ffe2fc}.filters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.filters button{border:1px solid #ef77dc;border-radius:12px;background:#2a1036;color:white;padding:5px 9px;cursor:pointer;font-size:clamp(10px,.9vw,14px)}.filters button.active{background:#ad268d}.search{width:100%;padding:8px 10px;border:1px solid #e975d9;border-radius:10px;background:#16091d;color:white}.items{overflow-y:auto;min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:7px}.items button{background:#260e35;color:white;border:1px solid #9f5b9f;border-radius:9px;padding:10px 7px;text-align:left;cursor:pointer}.items button:hover{background:#5b2263}.status{font-size:12px;color:#f7d7f2;text-align:center}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:9;background:#08030be8;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#1e0b2b;border:2px solid #f168df;border-radius:18px;padding:22px;box-shadow:0 0 30px #b720a4}.card h2{margin-top:0}.card img{max-width:100%;max-height:270px;object-fit:contain;display:block;margin:12px auto}.close{float:right;background:#4a1853;color:white;border:1px solid #ed70d8;padding:8px 16px;border-radius:9px;cursor:pointer}@media(max-width:700px){.nav a{border-width:1px;border-radius:6px;font-size:clamp(6px,1.3vw,10px)}.panel{left:56%;width:43%;top:27%;height:68%;padding:1%;border-radius:7px}.panel h1{font-size:11px}.filters{gap:2px}.filters button{font-size:8px;padding:3px}.search{padding:4px;font-size:10px}.items{grid-template-columns:1fr;gap:3px}.items button{font-size:10px;padding:5px}.status{font-size:9px}}
</style></head><body><main class="stage"><img src="objets-vehicules.png" width="1670" height="942" alt="Mortitia en mécanicienne appuyée sur sa moto, dans un garage de Leonida"><nav class="nav" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="actualites.html">Actualités</a><a href="missions.html">Missions</a><a href="personnages.html">Personnages</a><a href="animaux.html">Animaux</a><a href="objets.html">Objets</a><a href="activites.html">Activités</a><a href="admin.html">Administration</a></nav><div class="counter" id="total">— véhicules</div><section class="panel" aria-label="Catalogue des véhicules"><h1>Catalogue des véhicules</h1><div class="filters" id="filters"></div><input class="search" id="search" type="search" placeholder="Rechercher un véhicule…" aria-label="Rechercher un véhicule"><div class="items" id="items"></div><div class="status" id="status" role="status">Chargement…</div></section></main><div class="modal" id="modal" hidden><article class="card" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><button class="close" id="close">Fermer</button><h2 id="detailTitle"></h2><div id="detailBody"></div></article></div><script>
/* Compatible avec un fichier vehicules.json local ou une future route Worker /vehicules.
   Aucun véhicule fictif n'est injecté : le compteur reflète les données reçues. */
const API='https://gta6worker.michelmalandain.workers.dev/vehicules';
const TYPES=['Tous','Voitures','Motos','Bateaux','Hélicoptères','Avions','Utilitaires','Autres'];
let vehicles=[],type='Tous';const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function category(v){let t=String(v.type||v.category||v.kind||'').toLowerCase();if(/voiture|auto|car|sport|berline|suv/.test(t))return 'Voitures';if(/moto|bike|scooter/.test(t))return 'Motos';if(/bateau|boat|jet.?ski|navire/.test(t))return 'Bateaux';if(/hélico|helico|helicopter/.test(t))return 'Hélicoptères';if(/avion|plane|aircraft/.test(t))return 'Avions';if(/utilitaire|camion|truck|bus|van/.test(t))return 'Utilitaires';return 'Autres'}
function render(){const q=$('search').value.trim().toLocaleLowerCase('fr');const filtered=vehicles.filter(v=>(type==='Tous'||category(v)===type)&&String(v.name||v.nom||'').toLocaleLowerCase('fr').includes(q));$('items').replaceChildren();for(const v of filtered){const b=document.createElement('button');b.textContent=v.name||v.nom||'Sans nom';b.onclick=()=>detail(v);$('items').append(b)}$('status').textContent=vehicles.length?filtered.length+' véhicule(s) affiché(s)':'Aucune donnée véhicule chargée';}
function filters(){for(const t of TYPES){const b=document.createElement('button');b.textContent=t;b.className=t===type?'active':'';b.onclick=()=>{type=t;filtersReset();render()};$('filters').append(b)}}function filtersReset(){$('filters').replaceChildren();filters()}
function detail(v){$('detailTitle').textContent=v.name||v.nom||'Véhicule';const lines=[];for(const [label,key] of [['Type','type'],['Marque','brand'],['Modèle','model'],['Lieu','place'],['Description','summary']])if(v[key])lines.push('<p><strong>'+label+' :</strong> '+safe(v[key])+'</p>');if(v.description&&!v.summary)lines.push('<p>'+safe(v.description)+'</p>');const pic=String(v.image||'');$('detailBody').innerHTML=(pic&&/^(https:\/\/|[\w./-]+\.(png|jpg|jpeg|webp))$/i.test(pic)?'<img src="'+safe(pic)+'" alt="">':'')+lines.join('');$('modal').hidden=false}
$('close').onclick=()=>{$('modal').hidden=true};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true});$('search').oninput=render;
async function load(){for(const url of [API,'vehicules.json']){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)continue;const data=await r.json();const list=Array.isArray(data)?data:Array.isArray(data.vehicles)?data.vehicles:Array.isArray(data.vehicules)?data.vehicules:Array.isArray(data.items)?data.items:Array.isArray(data.data)?data.data:null;if(!list)continue;vehicles=list.filter(v=>v&&typeof v==='object');break}catch(e){}}vehicles.sort((a,b)=>String(a.name||a.nom||'').localeCompare(String(b.name||b.nom||''),'fr'));$('total').textContent=vehicles.length+' véhicules';render()}
filters();load();
</script></body></html>
