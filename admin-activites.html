<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration des activités — Le Carnet de Leonida</title><style>*{box-sizing:border-box}body{margin:0;background:#180821;color:#fff;font:16px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:25px}h1{font:italic bold 34px Georgia;color:#f9c4ef}a{color:#f9c4ef}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.panel{border:1px solid #e27ecb;border-radius:14px;background:#2a1135;padding:22px;margin:15px 0}label{display:block;margin:12px 0 5px;color:#f5c0e7}input,select,textarea{width:100%;padding:10px;background:#14081e;color:white;border:1px solid #a971b1;border-radius:6px;font:inherit}textarea{min-height:120px}button,.button{padding:11px 16px;border:1px solid #ec9ed9;border-radius:7px;background:#51205f;color:white;cursor:pointer;font:inherit}button:hover{background:#733182}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.muted{color:#d8bbdb}.danger{border-color:#e88}#message{min-height:25px;color:#f6d998}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><p><a href="admin.html">← Retour à l'administration</a></p><h1>Administration — Activités</h1><p class="muted">Gestion du catalogue des activités. Les modifications restent dans cette page jusqu'à l'export du JSON ; aucune donnée n'est envoyée au Worker.</p><div class="bar"><button id="load">Charger le catalogue du site</button><label class="button" style="margin:0">Importer un JSON<input type="file" id="file" accept=".json,application/json" hidden></label><button id="export">Exporter le JSON modifié</button></div><p id="message" role="status"></p><section class="panel"><label for="list">Activité à modifier</label><select id="list"></select><div class="bar"><button id="new">Nouvelle activité</button><button id="delete" class="danger">Supprimer l'activité sélectionnée</button></div><form id="form"><div class="row"><div><label for="name">Nom</label><input id="name" required></div><div><label for="kind">Catégorie principale</label><input id="kind" value="Activités" required></div></div><label for="summary">Description</label><textarea id="summary"></textarea><div class="row"><div><label for="place">Lieu</label><input id="place"></div><div><label for="image">Photo JPG (chemin GitHub)</label><input id="image" placeholder="images/activites/nom.jpg"></div></div><label for="video">Vidéo (adresse ou chemin)</label><input id="video"><div class="bar"><button type="submit">Valider la fiche</button></div></form></section></main><script>
const $=id=>document.getElementById(id);let items=[],selected=-1;const fields=['name','kind','summary','place','image','video'];function message(s){$('message').textContent=s}function refresh(){const old=selected;$('list').replaceChildren();items.forEach((x,i)=>$('list').add(new Option(x.name||'(sans nom)',i)));selected=Math.min(old,items.length-1);$('list').value=selected>=0?String(selected):'';show()}function show(){const x=items[selected]||{};for(const f of fields)$(f).value=x[f]||''}function select(i){selected=i;show()}$('list').onchange=e=>select(Number(e.target.value));$('new').onclick=()=>{selected=-1;show();$('name').focus()};$('delete').onclick=()=>{if(selected<0)return;if(!confirm('Supprimer cette activité ?'))return;items.splice(selected,1);refresh();message('Activité supprimée. Exporter le JSON pour enregistrer.')};$('form').onsubmit=e=>{e.preventDefault();const x=selected>=0?{...items[selected]}:{};for(const f of fields)x[f]=$(f).value.trim();if(!x.name)return; if(selected<0){items.push(x);selected=items.length-1}else items[selected]=x;refresh();message('Fiche enregistrée dans le catalogue local. Exporter le JSON pour publier.')};async function read(r){const d=await r.json();if(!Array.isArray(d))throw Error('Le fichier doit contenir une liste JSON');items=d;selected=items.length?0:-1;refresh();message(items.length+' activités chargées.')} $('load').onclick=async()=>{try{const r=await fetch('gta6-activites-complet.json',{cache:'no-store'});if(!r.ok)throw Error('Catalogue introuvable');await read(r)}catch(e){message('Erreur : '+e.message)}};$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await read(new Response(f))}catch(err){message('Erreur : '+err.message)}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)+'\n'],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='gta6-activites-complet.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);message('JSON exporté : remplacer le fichier correspondant sur GitHub pour publier.')};$('load').click();
</script></body></html>
