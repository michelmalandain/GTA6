function saveScore(){let scores=getScores();let old=scores.find(s=>s.pseudo.toLocaleLowerCase('fr')===pseudo.toLocaleLowerCase('fr'));if(old){if(score>old.score){old.score=score;old.level=names[level]}}else{scores.push({pseudo,score,level:names[level]})}scores.sort((a,b)=>b.score-a.score||a.pseudo.localeCompare(b.pseudo));localStorage.setItem('leonida-top5-v1',JSON.stringify(scores.slice(0,5)));top5()}
function setup(){ui.innerHTML='<div class="quiz-panel"><h2>LEONIDA QUIZ</h2><p>10 questions sur toute la saga GTA</p><input id="quiz-name" maxlength="20" placeholder="Votre pseudo" autocomplete="nickname" aria-label="Votre pseudo"><div class="quiz-levels"><button data-level="easy" class="active">Débutant</button><button data-level="medium">Confirmé</button><button data-level="hard">Expert</button></div><button id="quiz-start">COMMENCER</button><p class="quiz-small" id="quiz-msg">Choisissez votre niveau</p></div>';level='easy';ui.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;ui.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('quiz-start').onclick=()=>{pseudo=document.getElementById('quiz-name').value.trim().replace(/\s+/g,' ').slice(0,20);if(pseudo.length<2){document.getElementById('quiz-msg').textContent='Choisissez un pseudo de 2 à 20 caractères.';return}const pool=bank.filter(q=>q.level===level);deck=pool.sort(()=>Math.random()-.5).slice(0,10);pos=0;score=0;ask()}}
function ask(){locked=false;const q=deck[pos];ui.innerHTML='<div class="quiz-panel"><p class="quiz-small">'+clean(pseudo)+' · '+names[level]+' · Question '+(pos+1)+'/10 · '+score+' pts</p><h2>'+clean(q.q)+'</h2><div class="quiz-answers"></div><p class="quiz-small" id="quiz-feedback" aria-live="polite">Choisissez une réponse</p><button id="quiz-next" style="display:none">SUIVANT</button></div>';const area=ui.querySelector('.quiz-answers');q.options.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(locked)return;locked=true;const ok=i===q.correct;if(ok)score+=points[level];area.querySelectorAll('button').forEach((btn,k)=>{btn.disabled=true;if(k===q.correct)btn.classList.add('good');else if(k===i)btn.classList.add('bad')});document.getElementById('quiz-feedback').textContent=ok?'Morticia : Bravo, mon petit !':'Morticia : Dommage, mon chéri… Réponse : '+q.options[q.correct];document.getElementById('quiz-next').style.display='inline-block'};area.append(b)});document.getElementById('quiz-next').onclick=()=>{pos++;if(pos>=10)finish();else ask()}}
function finish(){saveScore();ui.innerHTML='<div class="quiz-panel"><h2>FIN DE PARTIE</h2><p>'+clean(pseudo)+', vous marquez <strong>'+score+' points</strong> sur '+(10*points[level])+'.</p><p>Morticia vous attend pour une revanche !</p><button id="quiz-again">REJOUER</button></div>';document.getElementById('quiz-again').onclick=setup}
function open(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');top5();setup();curtain.classList.remove('up');curtain.classList.add('down');setTimeout(()=>{curtain.classList.remove('down');curtain.classList.add('up')},650)}
function close(){curtain.classList.remove('up');curtain.classList.add('down');setTimeout(()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');curtain.classList.remove('down')},900)}
document.getElementById('quiz-launch').onclick=open;document.getElementById('quiz-exit').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))close()});
})();
</script>
</body>
</html>
