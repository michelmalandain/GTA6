<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vêtements — Le Carnet de Leonida</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#13051d;color:#fff;font-family:Georgia,serif}
.stage{position:relative;width:min(100%,1673px);margin:0 auto;overflow:hidden}
.stage>img{display:block;width:100%;height:auto}
/* Bandeau HTML identique à la navigation des véhicules, sans boutons peints dans le PNG. */
.nav{position:absolute;top:17.65%;left:0;width:100%;height:7.5%;display:grid;grid-template-columns:1fr 1.15fr 1fr 1.4fr 1fr 1fr 1.1fr 1.55fr;gap:.3%;padding:.25% 1%;background:linear-gradient(#170820,#080311);z-index:3}
.nav a{display:flex;align-items:center;justify-content:center;min-width:0;color:white;text-decoration:none;font-size:clamp(8px,1.48vw,23px);font-weight:bold;font-style:italic;text-shadow:0 2px 3px #000;border:2px solid #fc65e9;border-radius:18px;background:linear-gradient(#390e4b,#07030c 72%);box-shadow:inset 0 0 9px #d92ed6,0 0 9px #f333c9}
.nav a:hover,.nav a:focus-visible{background:#6a176f;outline:1px solid white}
/* Catalogue ouvert à la demande pour préserver le décor. */
.catalogue{width:min(960px,96vw);max-height:88vh;overflow:auto;padding:24px;scrollbar-color:#ef72e8 #1b0a25;background:linear-gradient(145deg,#2c0b39,#10051a 75%);border:2px solid #f46add;border-radius:18px;box-shadow:0 0 26px #e431ca}.catalogue-backdrop{position:fixed;inset:0;z-index:20;background:rgba(4,0,10,.88);display:flex;align-items:center;justify-content:center;padding:14px}.catalogue-backdrop[hidden]{display:none}.catalogue h2{margin:0 0 14px}.catalogue-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.open-catalogue{position:absolute;left:39%;top:75%;width:23%;min-height:7%;z-index:4;font:italic bold clamp(10px,1.5vw,24px) Georgia,serif;color:#fff;border:2px solid #fc65e9;border-radius:18px;background:linear-gradient(#390e4be8,#07030ce8);box-shadow:0 0 14px #f333c9;cursor:pointer}.open-catalogue:hover{background:#6a176f}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.filters select,.filters input{min-width:0;background:#210b31;color:#fff;border:1px solid #f27cdd;border-radius:8px;padding:7px;font:inherit;font-size:clamp(9px,.85vw,14px)}.filters input{flex:1 1 110px}.filters select{flex:1 1 120px}
.weapon{display:grid;grid-template-columns:30% 1fr;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #8b448e;background:rgba(16,4,29,.6);margin-bottom:4px;border-radius:7px}.weapon img{width:100%;aspect-ratio:274/154;object-fit:contain;border-radius:6px;background:#100c18}.weapon strong{display:block;color:#fff;font-size:clamp(10px,1.05vw,17px)}.weapon small{display:block;color:#efb8ee;font-size:clamp(8px,.8vw,13px);margin-top:4px}.weapon em{display:block;color:#dfc4df;font-size:clamp(8px,.72vw,12px);font-style:normal;margin-top:3px}.notice{font-size:clamp(8px,.68vw,11px);color:#e5bfe3;margin:4px 0 9px}
@media(max-width:700px){.catalogue{padding:.5%}.weapon{gap:4px;padding:3px 1px}.filters{gap:2px;margin-bottom:2px}.filters input,.filters select{padding:2px;font-size:8px}.weapon small,.weapon em{font-size:7px}.weapon strong{font-size:8px}}
/* Compteur discret sous le bandeau. */
.counter{position:absolute;left:43%;top:28%;width:14%;height:5.5%;display:flex;align-items:center;justify-content:center;border:2px solid #fc65e9;border-radius:18px;background:linear-gradient(#390e4bdf,#07030cde);box-shadow:0 0 12px #f333c9;color:#fff;font-weight:bold;font-size:clamp(11px,1.6vw,26px);text-shadow:0 0 8px #ff65e3;z-index:2}
@media(max-width:700px){.nav a{border-width:1px;border-radius:6px;font-size:clamp(6px,1.3vw,10px)}.counter{border-width:1px;border-radius:6px}}

/* Fenêtre de détail : indépendante du décor validé. */
.weapon{cursor:pointer}.weapon:hover,.weapon:focus-visible{box-shadow:inset 0 0 0 1px #f6a0ed;background:rgba(70,12,75,.65);outline:none}
.dialog-backdrop{position:fixed;inset:0;z-index:30;background:rgba(4,0,10,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog-backdrop[hidden]{display:none}.dialog{width:min(780px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#2c0b39,#10051a 75%);border:2px solid #f46add;border-radius:18px;box-shadow:0 0 26px #e431ca;padding:22px;color:#fff}
.dialog h2{margin:0 0 12px;font-size:clamp(20px,2.4vw,32px)}.detail-grid{display:grid;grid-template-columns:minmax(0,45%) 1fr;gap:20px;align-items:start}.detail-grid img{width:100%;max-height:340px;object-fit:contain;background:#100c18;border-radius:10px}.dialog p{line-height:1.5;overflow-wrap:anywhere}.dialog label{display:block;margin:12px 0 5px;color:#efb8ee}.dialog input,.dialog textarea,.dialog select{width:100%;background:#170920;color:white;border:1px solid #9d539e;border-radius:7px;padding:9px;font:inherit}.dialog textarea{min-height:100px;resize:vertical}.dialog-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;margin-top:18px}.small-btn{background:#32123e;color:#fff;border:1px solid #c77ac2;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}.small-btn:hover{background:#62256d}.small-btn.danger{border-color:#e3a0ad}.dialog .error{color:#ffc2ce}.dialog .success{color:#bfffd5}.admin-row{display:flex;justify-content:flex-end;margin-top:8px}.admin-row .small-btn{font-size:12px;padding:5px 9px;opacity:.85}
@media(max-width:580px){.detail-grid{grid-template-columns:1fr}.dialog{padding:14px}}

.nav{grid-template-columns:repeat(8,minmax(0,1fr));}
.nav a{font-size:clamp(8px,1.25vw,20px);}
@media(max-width:700px){.nav a{font-size:clamp(6px,1.2vw,10px)}}
body:has(#dialog-backdrop:not([hidden])) .nav{visibility:hidden!important;}
</style></head><body>
<main class="stage">
<img src="objets-vetements.png" width="1651" height="928" alt="Vêtements de Leonida : Mortitia dans sa boutique, espace pour le catalogue">
<nav class="nav" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="actualites.html">Actualités</a><a href="quiz.html">Quiz</a><a href="missions.html">Missions</a><a href="personnages.html">Personnages</a><a href="animaux.html">Animaux</a><a href="objets.html">Objets</a><a href="activites.html">Activités</a></nav>
<div class="counter" id="vetements-total" aria-live="polite">Chargement…</div>
<button type="button" class="open-catalogue" id="open-catalogue">VOIR LES VÊTEMENTS</button>
</main>
<div class="catalogue-backdrop" id="catalogue-backdrop" hidden><section class="catalogue" role="dialog" aria-modal="true" aria-label="Catalogue des vêtements"><div class="catalogue-head"><h2>Vêtements de Leonida</h2><button type="button" class="small-btn" id="close-catalogue">Fermer</button></div><div class="filters"><input id="q" placeholder="Rechercher un vêtement" aria-label="Rechercher"><select id="cat" aria-label="Catégorie"><option value="">Toutes les catégories</option></select></div><div id="vetements"></div></section></div>
<div class="dialog-backdrop" id="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
<h2 id="detail-title"></h2><div id="detail-content"></div><div class="dialog-actions" id="detail-actions"></div>
</section></div>
<script>
const API='https://gta6worker.michelmalandain.workers.dev/objets';
const container=document.getElementById('vetements'),counter=document.getElementById('vetements-total'),q=document.getElementById('q'),cat=document.getElementById('cat');
const catalogueBackdrop=document.getElementById('catalogue-backdrop');
document.getElementById('open-catalogue').addEventListener('click',()=>{catalogueBackdrop.hidden=false;document.getElementById('close-catalogue').focus()});
document.getElementById('close-catalogue').addEventListener('click',()=>catalogueBackdrop.hidden=true);
catalogueBackdrop.addEventListener('click',e=>{if(e.target===catalogueBackdrop)catalogueBackdrop.hidden=true});
const backdrop=document.getElementById('dialog-backdrop'),title=document.getElementById('detail-title'),content=document.getElementById('detail-content'),actions=document.getElementById('detail-actions');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],selected=null,token='';
const category=x=>(x.summary||'').match(/^Catégorie\s*:\s*([^\n]+)/i)?.[1]||'Vêtements';
function button(label,fn,cls=''){let b=document.createElement('button');b.type='button';b.className='small-btn '+cls;b.textContent=label;b.addEventListener('click',fn);return b}
function closeDialog(){backdrop.hidden=true;selected=null;content.replaceChildren();actions.replaceChildren()}
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!backdrop.hidden)closeDialog();else if(!catalogueBackdrop.hidden)catalogueBackdrop.hidden=true}});
function openDialog(x){selected=x;backdrop.hidden=false;showDetail()}
function showDetail(){const x=selected;if(!x)return;title.textContent=x.name;content.innerHTML=`<div class="detail-grid"><img src="${escapeHtml(x.image||'')}" alt="${escapeHtml(x.name)}"><div><p><strong>Catégorie :</strong> ${escapeHtml(category(x))}</p>${x.model?`<p><strong>Modèle :</strong> ${escapeHtml(x.model)}</p>`:''}${x.brand?`<p><strong>Marque :</strong> ${escapeHtml(x.brand)}</p>`:''}${x.place?`<p><strong>Lieu :</strong> ${escapeHtml(x.place)}</p>`:''}${x.summary?`<p>${escapeHtml(x.summary).replace(/\n/g,'<br>')}</p>`:''}</div></div>`;
actions.replaceChildren();if(token){actions.append(button('Modifier',showEdit),button('Supprimer',showDelete,'danger'),button('Déconnexion',()=>{token='';showDetail()}))}else{actions.append(button('Administration',showLogin))}actions.append(button('Fermer',closeDialog))}
function showLogin(){title.textContent='Accès administrateur';content.innerHTML='<p>Entre le jeton administrateur configuré dans Cloudflare. Il ne sera pas enregistré sur le site.</p><label for="secret">Jeton administrateur</label><input id="secret" type="password" autocomplete="off"><p class="error" id="login-error" role="status"></p>';actions.replaceChildren();actions.append(button('Valider',async()=>{let value=document.getElementById('secret').value.trim();if(!value){document.getElementById('login-error').textContent='Jeton requis.';return}try{let r=await fetch(API+'/00000000-0000-4000-8000-000000000000',{method:'DELETE',headers:{'Authorization':'Bearer '+value}});if(r.status!==404)throw Error(r.status===401?'Jeton incorrect.':'Vérification impossible ('+r.status+').');token=value;showDetail()}catch(e){document.getElementById('login-error').textContent=e.message}}),button('Annuler',showDetail));document.getElementById('secret').focus()}
function showEdit(){const x=selected;title.textContent='Modifier : '+x.name;content.innerHTML=`<form id="edit-form"><label for="edit-name">Nom</label><input id="edit-name" required maxlength="160"><label for="edit-category">Catégorie</label><input id="edit-category" maxlength="120"><label for="edit-model">Modèle</label><input id="edit-model" maxlength="120"><label for="edit-brand">Marque</label><input id="edit-brand" maxlength="120"><label for="edit-place">Lieu</label><input id="edit-place" maxlength="240"><label for="edit-image">Chemin de la photo (GitHub)</label><input id="edit-image" maxlength="500"><label for="edit-summary">Description complémentaire</label><textarea id="edit-summary" maxlength="6000"></textarea><p id="edit-status" class="error" role="status"></p></form>`;
const field=(id,v)=>document.getElementById(id).value=v||'';field('edit-name',x.name);field('edit-category',category(x));field('edit-model',x.model);field('edit-brand',x.brand);field('edit-place',x.place);field('edit-image',x.image);field('edit-summary',(x.summary||'').replace(/^Catégorie\s*:[^\n]*(?:\n|$)/i,'').trim());
actions.replaceChildren();actions.append(button('Enregistrer',async()=>{const v=id=>document.getElementById(id).value.trim();let summary='Catégorie : '+(v('edit-category')||'Vêtements')+(v('edit-summary')?'\n'+v('edit-summary'):'');let body={name:v('edit-name'),kind:'Vêtements',model:v('edit-model'),brand:v('edit-brand'),place:v('edit-place'),image:v('edit-image'),summary};try{let r=await fetch(API+'/'+encodeURIComponent(x.id),{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(data.error||'Erreur '+r.status);Object.assign(x,data.objet||body);render();showDetail()}catch(e){document.getElementById('edit-status').textContent=e.message}}),button('Annuler',showDetail))}
function showDelete(){title.textContent='Confirmer la suppression';content.innerHTML='<p>Supprimer définitivement <strong>'+escapeHtml(selected.name)+'</strong> de la base des vêtements ?</p><p>Cette action ne supprime pas le fichier photo sur GitHub.</p><p id="delete-status" class="error" role="status"></p>';actions.replaceChildren();actions.append(button('Oui, supprimer',async()=>{try{let r=await fetch(API+'/'+encodeURIComponent(selected.id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Erreur '+r.status)}items=items.filter(x=>x.id!==selected.id);render();closeDialog()}catch(e){document.getElementById('delete-status').textContent=e.message}},'danger'),button('Annuler',showDetail))}
function render(){counter.textContent=items.length+' vêtement'+(items.length>1?'s':'');const cats=[...new Set(items.map(category))].sort((a,b)=>a.localeCompare(b,'fr'));let old=cat.value;cat.replaceChildren(new Option('Toutes les catégories',''));cats.forEach(c=>cat.add(new Option(c,c)));cat.value=cats.includes(old)?old:'';let term=q.value.toLocaleLowerCase('fr'),c=cat.value;let matches=items.filter(x=>(!c||category(x)===c)&&(!term||(x.name+' '+category(x)+' '+(x.model||'')).toLocaleLowerCase('fr').includes(term)));container.replaceChildren();if(!matches.length){container.textContent='Aucun vêtement trouvé.';return}matches.forEach(x=>{let article=document.createElement('article');article.className='weapon';article.tabIndex=0;article.setAttribute('role','button');article.setAttribute('aria-label','Voir la fiche de '+x.name);article.innerHTML=`<img loading="lazy" src="${escapeHtml(x.image||'')}" alt="${escapeHtml(x.name)}"><div><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(category(x))}</small>${x.model?`<em>Modèle : ${escapeHtml(x.model)}</em>`:''}</div>`;article.addEventListener('click',()=>openDialog(x));article.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDialog(x)}});container.append(article)})}
q.addEventListener('input',render);cat.addEventListener('change',render);
fetch(API).then(r=>{if(!r.ok)throw Error('Worker indisponible');return r.json()}).then(data=>{items=(data.objets||[]).filter(x=>x.kind==='Vêtements');render()}).catch(()=>{container.textContent='Catalogue indisponible : vérifier le Worker /objets';counter.textContent='— vêtements'});
</script></body></html>
